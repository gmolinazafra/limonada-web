<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Autorización provisional para conducir</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f3f4f6;font-family:Arial,sans-serif}
    body{overflow:hidden}
    #pdf{width:100%;height:100%;border:0;display:block}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#333;background:#f3f4f6;font-size:18px}
  </style>
</head>
<body>
  <div id="loading">Cargando autorización provisional…</div>
  <iframe id="pdf" title="Autorización provisional para conducir de Adrián Molina Pedrosa"></iframe>
  <script>
    fetch('./autorizacion-provisional.pdf.b64', {cache:'no-store'})
      .then(r => {
        if(!r.ok) throw new Error('No se pudo cargar el documento');
        return r.text();
      })
      .then(b64 => {
        const clean = b64.replace(/\s+/g,'');
        document.getElementById('pdf').src = 'data:application/pdf;base64,' + clean;
        document.getElementById('loading').style.display = 'none';
      })
      .catch(() => {
        document.getElementById('loading').textContent = 'No se pudo cargar el documento.';
      });
  </script>
</body>
</html>
