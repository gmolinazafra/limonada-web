<html lang="es">
<head>

<style>
  :root{
    --tinta:#0E3B32; --tinta-suave:#2C5C51; --hoja:#4A8B3B;
    --papel:#F5F0E4; --papel-alto:#FFFDF6;
    --rojo:#C0453C; --ambar:#E8A93B; --azul:#3A6E9B;
    --gris:#6E6A5C; --linea:rgba(14,59,50,.14);
    --sombra:0 10px 30px rgba(14,59,50,.13); --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,-apple-system,sans-serif;
       font-size:16px;line-height:1.5;min-height:100dvh;overscroll-behavior-y:none}
  button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--hoja);outline-offset:2px;border-radius:4px}
  .app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
       padding:0 20px env(safe-area-inset-bottom) 20px}

  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
  .marca{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:17px}
  .marca em{font-style:normal;color:var(--hoja)}
  .marca img{height:34px;width:auto;display:block;flex:none}
  .top-der{display:flex;align-items:center;gap:8px}
  .racha{display:flex;align-items:center;gap:6px;background:var(--papel-alto);border:1px solid var(--linea);
         border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
  .racha b{color:var(--hoja)}
  .icono{width:36px;height:36px;border-radius:999px;border:1px solid var(--linea);background:var(--papel-alto);
         display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}

  .saludo{font-family:'Literata',Georgia,serif;font-size:25px;line-height:1.25;font-weight:600;
          margin:14px 0 4px;letter-spacing:-.015em}
  .sub{color:var(--gris);font-size:14.5px;margin:0 0 20px;max-width:36ch}

  .estante{position:relative;padding:26px 0 0}
  .lomos{display:flex;gap:11px;align-items:flex-end;overflow-x:auto;padding:0 2px 14px;
         scroll-snap-type:x proximity;scrollbar-width:none}
  .lomos::-webkit-scrollbar{display:none}
  .balda{height:9px;background:linear-gradient(180deg,#A9754A,#8A5C38);border-radius:2px;
         box-shadow:0 7px 14px rgba(14,59,50,.18);margin-bottom:26px}
  .lomo{flex:none;width:52px;height:186px;border-radius:4px 4px 3px 3px;position:relative;
        display:flex;align-items:center;justify-content:center;scroll-snap-align:start;
        box-shadow:inset -7px 0 12px rgba(0,0,0,.17),inset 3px 0 5px rgba(255,255,255,.2);
        transition:transform .18s ease}
  .lomo:active{transform:translateY(-7px)}
  .lomo .tit{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-weight:600;font-size:13px;
             max-height:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:3;
             text-shadow:0 1px 3px rgba(0,0,0,.45)}
  .lomo .marca-pag{position:absolute;right:9px;top:-15px;width:10px;height:22px;background:var(--papel);
        border-radius:2px 2px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.28);z-index:1}
  .lomo .leido{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.2);
        border-top:2px solid rgba(255,255,255,.9);z-index:2;pointer-events:none;
        border-radius:0 0 3px 3px;transition:height .45s cubic-bezier(.3,1.2,.4,1)}
  .lomo.nuevo{background:var(--papel-alto);border:2px dashed var(--linea);box-shadow:none;
              color:var(--tinta-suave);height:150px}
  .lomo.nuevo span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:12.5px}

  .bloque{margin:26px 0 0}
  .bloque h2{font-family:'Literata',Georgia,serif;font-size:15.5px;font-weight:600;margin:0 0 10px}
  .fila{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--papel-alto);
        border:1px solid var(--linea);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
  .canto{width:6px;height:34px;border-radius:3px;flex:none}
  .fila .info{flex:1;min-width:0}
  .fila .info strong{display:block;font-family:'Literata',Georgia,serif;font-size:15px;font-weight:600;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fila .info small{color:var(--gris);font-size:12.5px}
  .fila .pg{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--tinta-suave)}

  .volver{display:inline-flex;align-items:center;gap:7px;color:var(--tinta-suave);font-weight:500;
          font-size:14.5px;padding:16px 0 6px}
  .libro-cab{display:flex;gap:16px;align-items:flex-start;margin:6px 0 22px}
  .portada{width:62px;height:92px;border-radius:3px 6px 6px 3px;flex:none;position:relative;box-shadow:var(--sombra)}
  .portada::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.2);
           border-radius:3px 0 0 3px}
  .libro-cab h1{font-family:'Literata',Georgia,serif;font-size:21px;line-height:1.25;margin:0 0 3px;font-weight:600}
  .libro-cab p{margin:0;color:var(--gris);font-size:14px}

  .lector{background:var(--papel-alto);border:1px solid var(--linea);border-radius:18px;padding:20px;
          text-align:center;box-shadow:var(--sombra)}
  .lector .etq{color:var(--gris);font-size:13.5px;margin:0}
  .pagina-num{font-family:'Literata',Georgia,serif;font-size:60px;font-weight:700;line-height:1;
        margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .de-total{color:var(--gris);font-size:13.5px;margin:0 0 16px}
  .barra{height:7px;background:rgba(14,59,50,.1);border-radius:99px;overflow:hidden;margin:0 0 6px}
  .barra i{display:block;height:100%;background:var(--hoja);border-radius:99px;transition:width .45s ease}
  .pct{font-size:12.5px;color:var(--gris);margin:0}
  .rapidos{display:flex;gap:8px;margin:18px 0 0}
  .rapidos button{flex:1;background:rgba(74,139,59,.1);color:var(--tinta);border-radius:11px;padding:11px 0;
        font-weight:600;font-size:14.5px}
  .teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 0}
  .teclado button{background:var(--papel-alto);border:1px solid var(--linea);border-radius:12px;
        padding:15px 0;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
  .teclado .aux{font-size:14.5px;font-weight:600;color:var(--tinta-suave)}
  .entrada{font-family:'Literata',Georgia,serif;font-size:34px;font-weight:600;text-align:center;
        padding:10px 0 2px;font-variant-numeric:tabular-nums;min-height:52px}
  .entrada.vacio{color:var(--gris)}
  .ritmo{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0 0}
  .ritmo div{background:var(--papel-alto);border:1px solid var(--linea);border-radius:12px;padding:12px 9px;text-align:center}
  .ritmo b{display:block;font-family:'Literata',Georgia,serif;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .ritmo small{color:var(--gris);font-size:11.5px;line-height:1.3;display:block;margin-top:2px}

  .cta{display:block;width:100%;background:var(--tinta);color:var(--papel-alto);border-radius:13px;
       padding:16px;font-weight:600;font-size:16px;margin:14px 0 0;box-shadow:var(--sombra);text-align:center;
       text-decoration:none}
  .cta:disabled{opacity:.35;box-shadow:none}
  .cta.sec{background:transparent;color:var(--tinta-suave);box-shadow:none;border:1px solid var(--linea);
       font-weight:500;font-size:14.5px;padding:13px}
  .cta.verde{background:var(--hoja)}

  .campo{margin:0 0 14px}
  .campo label{display:block;font-size:13.5px;font-weight:500;color:var(--tinta-suave);margin:0 0 6px}
  .campo input{width:100%;background:var(--papel-alto);border:1px solid var(--linea);border-radius:11px;
        padding:13px 14px;font-size:16px}
  .campo input:focus{outline:none;border-color:var(--hoja);box-shadow:0 0 0 3px rgba(74,139,59,.16)}
  .campo.clave{position:relative}
  .campo.clave input{padding-right:52px}
  .ojo{position:absolute;right:6px;bottom:6px;width:40px;height:40px;display:flex;align-items:center;
       justify-content:center;color:var(--gris);border-radius:9px}
  .ojo:hover{color:var(--tinta);background:rgba(14,59,50,.06)}
  .ojo svg{width:21px;height:21px;display:block}
  .colores{display:flex;gap:9px;flex-wrap:wrap}
  .colores button{width:36px;height:36px;border-radius:9px;border:2.5px solid transparent}
  .colores button[aria-pressed="true"]{border-color:var(--tinta);transform:scale(1.06)}

  .acceso{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:30px 0}
  .acceso .hero{text-align:center;margin:0 0 26px}
  .acceso .hero img{width:210px;height:auto;margin:0 auto;display:block}
  .acceso h1{font-family:'Literata',Georgia,serif;font-size:30px;font-weight:700;margin:22px 0 6px;letter-spacing:-.02em}
  .acceso .hero p{color:var(--gris);font-size:15px;margin:0;max-width:30ch;margin-inline:auto}
  .tabs{display:flex;gap:6px;background:rgba(14,59,50,.07);border-radius:12px;padding:4px;margin:0 0 18px}
  .tabs button{flex:1;padding:10px 0;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--tinta-suave)}
  .tabs button[aria-selected="true"]{background:var(--papel-alto);color:var(--tinta);box-shadow:0 2px 6px rgba(14,59,50,.1)}
  .error{background:rgba(192,69,60,.1);border:1px solid rgba(192,69,60,.3);color:#8E332C;border-radius:11px;
         padding:12px 14px;font-size:14px;margin:0 0 14px}

  .muro{background:var(--tinta);color:var(--papel-alto);border-radius:18px;padding:24px;margin:20px 0 0;text-align:center}
  .muro h2{font-family:'Literata',Georgia,serif;font-size:20px;margin:0 0 8px;font-weight:600}
  .muro p{color:rgba(245,240,228,.75);font-size:14px;margin:0 0 4px;line-height:1.5}
  .precio{font-family:'Literata',Georgia,serif;font-size:42px;font-weight:700;margin:16px 0 0;letter-spacing:-.02em}
  .precio span{font-size:15px;font-weight:400;color:rgba(245,240,228,.7);display:block;margin-top:2px}
  .ventajas{text-align:left;margin:18px 0 0;padding:0;list-style:none}
  .ventajas li{padding:7px 0 7px 26px;position:relative;font-size:14px;color:rgba(245,240,228,.9)}
  .ventajas li::before{content:"✓";position:absolute;left:0;color:var(--hoja);font-weight:700}

  .banner{background:rgba(232,169,59,.16);border:1px solid rgba(232,169,59,.5);border-radius:12px;
          padding:12px 14px;font-size:13.5px;margin:14px 0 0;display:flex;gap:10px;align-items:center}
  .banner b{font-weight:600}
  .banner button{margin-left:auto;background:var(--tinta);color:var(--papel-alto);border-radius:9px;
          padding:8px 13px;font-size:13px;font-weight:600;flex:none}

  .ajuste{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--papel-alto);
          border:1px solid var(--linea);border-radius:var(--r);padding:14px;margin:0 0 8px;font-size:14.5px}
  .ajuste small{display:block;color:var(--gris);font-size:12.5px;margin-top:2px}

  .pie{text-align:center;color:var(--gris);font-size:12.5px;padding:26px 0 30px;line-height:1.6}
  .pie a{color:var(--tinta-suave);font-weight:600;text-decoration:none}
  .vacio-msg{background:var(--papel-alto);border:1px dashed var(--linea);border-radius:var(--r);
        padding:22px;text-align:center;color:var(--gris);font-size:14.5px}
  .cargando{min-height:100dvh;display:flex;align-items:center;justify-content:center;color:var(--gris);font-size:15px}
  .aviso{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);opacity:0;
        background:var(--tinta);color:var(--papel-alto);padding:12px 20px;border-radius:999px;font-size:14px;
        font-weight:500;box-shadow:var(--sombra);pointer-events:none;transition:opacity .25s ease,transform .25s ease;
        z-index:50;max-width:88vw;text-align:center}
  .aviso.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Móviles: que la ficha quepa sin scroll ---------- */
  @media(max-width:640px){
    .app{padding:0 16px env(safe-area-inset-bottom) 16px}
    .top{padding:14px 0 4px}
    .saludo{font-size:22px;margin:10px 0 3px}
    .sub{font-size:14px;margin:0 0 14px}

    .estante{padding:20px 0 0}
    .lomo{width:48px;height:168px}
    .lomo .tit{font-size:12px;max-height:132px}
    .balda{margin-bottom:18px}

    .volver{padding:12px 0 4px}
    .libro-cab{gap:13px;margin:4px 0 14px}
    .portada{width:52px;height:78px}
    .libro-cab h1{font-size:18.5px}
    .libro-cab p{font-size:13.5px}

    .lector{padding:15px;border-radius:16px}
    .pagina-num{font-size:46px;margin:3px 0 0}
    .de-total{margin:0 0 11px;font-size:12.5px}
    .lector .etq{font-size:12.5px}
    .rapidos{margin:13px 0 0;gap:7px}

    .ritmo{margin:14px 0 0;gap:7px}
    .ritmo div{padding:10px 6px}

    .fila{padding:11px 12px}

    .acceso{padding:20px 0}

    .acceso .hero img{width:158px}
    .acceso .hero p{font-size:14.5px}
    .campo{margin:0 0 11px}

  }
  /* Pantallas bajas: recortar todavía más para que el teclado sea alcanzable */
  @media(max-height:720px){
    .pagina-num{font-size:40px}
    .teclado button{padding:10px 0;font-size:18px}

    .acceso .hero img{width:132px}
    .acceso .hero{margin:0 0 14px}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---- Configuración ---- */
window.BM_CONF = {
  SUPABASE_URL: 'https://busqdxmrcdhbhlfpvovv.supabase.co',
  SUPABASE_KEY: 'sb_publishable_83PUk1CiXeetuYX8d0jESg_qLCF4Xt0',
  /* Pega aquí el Payment Link de Stripe cuando lo crees. Vacío = botón deshabilitado. */
  STRIPE_LINK: '',
  PRECIO: '12,99 €',
  COLORES: ['#C0453C','#E8A93B','#3A6E9B','#0E3B32','#4A8B3B','#7B4B8A','#B5652F','#2C5C51']
};

/* ---- Capa de datos ---- */
window.BM = (function(){
  var SB = window.supabase.createClient(
    window.BM_CONF.SUPABASE_URL,
    window.BM_CONF.SUPABASE_KEY,
    { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
  );

  function traducirError(e){
    var m = (e && (e.message || e.error_description) || '').toLowerCase();
    if (m.indexOf('invalid login') >= 0) return 'Email o contraseña incorrectos.';
    if (m.indexOf('already registered') >= 0 || m.indexOf('already been registered') >= 0)
      return 'Ese email ya tiene cuenta. Entra con tu contraseña.';
    if (m.indexOf('password should be') >= 0) return 'La contraseña necesita al menos 6 caracteres.';
    if (m.indexOf('email not confirmed') >= 0) return 'Confirma tu email antes de entrar.';
    if (m.indexOf('row-level security') >= 0 || m.indexOf('violates row-level') >= 0)
      return 'Tu suscripción ha caducado. Renuévala para seguir anotando.';
    if (m.indexOf('unique') >= 0) return 'Ese dato ya existe.';
    if (m.indexOf('failed to fetch') >= 0) return 'Sin conexión. Inténtalo de nuevo.';
    return (e && e.message) || 'Algo ha fallado.';
  }

  return {
    cliente: SB,
    traducirError: traducirError,
    sesion: function(){ return SB.auth.getSession(); },
    entrar: function(email, pass){
      return SB.auth.signInWithPassword({ email: email.trim(), password: pass });
    },
    registrar: function(email, pass, nombre){
      return SB.auth.signUp({
        email: email.trim(), password: pass,
        options: { data: { nombre: (nombre || '').trim() } }
      });
    },
    salir: function(){ return SB.auth.signOut(); },
    borrarCuenta: function(){ return SB.rpc('borrar_mi_cuenta'); },
    recuperar: function(email){
      return SB.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href });
    },
    biblioteca: function(){ return SB.rpc('mi_biblioteca'); },
    marcar: function(libroId, pagina){
      return SB.rpc('marcar_pagina', { p_libro_id: libroId, p_pagina: pagina });
    },
    crearLibro: function(uid, l){
      return SB.from('libros').insert({
        usuario_id: uid, titulo: l.titulo, autor: l.autor || null,
        paginas_total: l.total || null, color: l.color
      }).select().single();
    },
    borrarLibro: function(id){ return SB.from('libros').delete().eq('id', id); },
    cambiarEstado: function(id, estado){
      return SB.from('libros').update({ estado: estado }).eq('id', id);
    },
    saludo: function(){
      var h = new Date().getHours();
      if (h < 6)  return 'Se ha hecho de noche leyendo.';
      if (h < 13) return 'Buenos días. ¿Seguimos?';
      if (h < 20) return 'Buenas tardes. ¿Por dónde ibas?';
      return 'Buenas noches. Un rato de lectura.';
    },
    fecha: function(iso){
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
    }
  };
})();
</script>

<script>
const {
  useState,
  useEffect,
  useRef,
  useMemo,
  useCallback
} = React;
const BM = window.BM;
const CONF = window.BM_CONF;
function Aviso({
  texto
}) {
  return React.createElement("div", {
    className: 'aviso' + (texto ? ' on' : '')
  }, texto);
}
function Acceso({
  onEntrar
}) {
  const [modo, setModo] = useState('entrar');
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [verClave, setVerClave] = useState(false);
  const [nombre, setNombre] = useState('');
  const [error, setError] = useState('');
  const [ok, setOk] = useState('');
  const [cargando, setCargando] = useState(false);
  async function enviar() {
    setError('');
    setOk('');
    setCargando(true);
    try {
      if (modo === 'entrar') {
        const {
          error
        } = await BM.entrar(email, pass);
        if (error) throw error;
        onEntrar();
      } else {
        const {
          data,
          error
        } = await BM.registrar(email, pass, nombre);
        if (error) throw error;

      p: 'inicio'
