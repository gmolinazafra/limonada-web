<style>

    --tinta:#0E3B32;
    --tinta-suave:#2C5C51;
    --hoja:#4A8B3B;
    --papel:#F5F0E4;
    --papel-alto:#FFFDF6;
    --rojo:#C0453C;
    --ambar:#E8A93B;
    --azul:#3A6E9B;

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--papel);
    color:var(--tinta);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.5;
    min-height:100dvh;
    overscroll-behavior-y:none;

  button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font-family:inherit;font-size:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--hoja);outline-offset:2px;border-radius:4px}

  .app{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
       padding:0 20px env(safe-area-inset-bottom) 20px}

  /* ---------- Cabecera ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
  .marca{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:17px}
  .marca em{font-style:normal;color:var(--hoja)}
  .cinta-logo{width:15px;height:22px;background:var(--tinta);border-radius:3px 3px 0 0;position:relative;flex:none}
  .cinta-logo::after{content:"";position:absolute;left:0;right:0;bottom:-6px;
    border-left:7.5px solid var(--tinta);border-right:7.5px solid var(--tinta);border-bottom:6px solid transparent}
  .racha{display:flex;align-items:center;gap:6px;background:var(--papel-alto);border:1px solid var(--linea);
         border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
  .racha b{color:var(--hoja)}

  /* ---------- Saludo ---------- */
  .saludo{font-family:'Literata',Georgia,serif;font-size:25px;line-height:1.25;font-weight:600;
          margin:14px 0 4px;letter-spacing:-.015em}
  .sub{color:var(--gris);font-size:14.5px;margin:0 0 20px;max-width:36ch}

  /* ---------- Estante ---------- */
  .estante{position:relative;padding:26px 0 0}
  .lomos{display:flex;gap:11px;align-items:flex-end;overflow-x:auto;padding:0 2px 14px;
         scroll-snap-type:x proximity;scrollbar-width:none}
  .lomos::-webkit-scrollbar{display:none}
  .balda{height:9px;background:linear-gradient(180deg,#A9754A,#8A5C38);border-radius:2px;
         box-shadow:0 7px 14px rgba(14,59,50,.18);margin-bottom:26px}

  .lomo{flex:none;width:52px;height:186px;border-radius:4px 4px 3px 3px;position:relative;
        display:flex;align-items:center;justify-content:center;scroll-snap-align:start;
        box-shadow:inset -7px 0 12px rgba(0,0,0,.17),inset 3px 0 5px rgba(255,255,255,.2);
        transition:transform .18s ease}
  .lomo:active{transform:translateY(-7px)}
  .lomo .tit{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-weight:600;font-size:12.5px;
             letter-spacing:.01em;max-height:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
             text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .lomo .nervio{position:absolute;left:5px;right:5px;height:2px;background:rgba(255,255,255,.28)}
  .lomo .nervio.a{top:13px}.lomo .nervio.b{bottom:13px}
  .lomo .marca-pag{position:absolute;left:50%;transform:translateX(-50%);width:9px;background:var(--papel);
        top:-13px;border-radius:2px 2px 0 0;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .lomo .linea-pag{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.85)}

  .lomo.nuevo{background:var(--papel-alto);border:2px dashed var(--linea);box-shadow:none;
              color:var(--tinta-suave);height:150px}
  .lomo.nuevo span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:12.5px}

  /* ---------- Tarjetas de lista ---------- */
  .bloque{margin:26px 0 0}
  .bloque h2{font-family:'Literata',Georgia,serif;font-size:15.5px;font-weight:600;margin:0 0 10px}
  .fila{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--papel-alto);
        border:1px solid var(--linea);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
  .canto{width:6px;height:34px;border-radius:3px;flex:none}
  .fila .info{flex:1;min-width:0}
  .fila .info strong{display:block;font-family:'Literata',Georgia,serif;font-size:15px;font-weight:600;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fila .info small{color:var(--gris);font-size:12.5px}
  .fila .pg{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--tinta-suave)}

  /* ---------- Vista libro ---------- */
  .volver{display:inline-flex;align-items:center;gap:7px;color:var(--tinta-suave);font-weight:500;
          font-size:14.5px;padding:16px 0 6px}
  .libro-cab{display:flex;gap:16px;align-items:flex-start;margin:6px 0 22px}
  .portada{width:62px;height:92px;border-radius:3px 6px 6px 3px;flex:none;position:relative;
           box-shadow:var(--sombra);display:flex;align-items:flex-end;padding:8px 7px}
  .portada::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.2);
           border-radius:3px 0 0 3px}
  .libro-cab h1{font-family:'Literata',Georgia,serif;font-size:21px;line-height:1.25;margin:0 0 3px;
           font-weight:600;letter-spacing:-.01em}
  .libro-cab p{margin:0;color:var(--gris);font-size:14px}

  .lector{background:var(--papel-alto);border:1px solid var(--linea);border-radius:18px;padding:20px;
          text-align:center;box-shadow:var(--sombra)}
  .lector .etq{color:var(--gris);font-size:13.5px;margin:0}
  .pagina-num{font-family:'Literata',Georgia,serif;font-size:60px;font-weight:700;line-height:1;
        margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
  .de-total{color:var(--gris);font-size:13.5px;margin:0 0 16px}
  .barra{height:7px;background:rgba(14,59,50,.1);border-radius:99px;overflow:hidden;margin:0 0 6px}
  .barra i{display:block;height:100%;background:var(--hoja);border-radius:99px;transition:width .45s ease}
  .pct{font-size:12.5px;color:var(--gris);margin:0}

  .rapidos{display:flex;gap:8px;margin:18px 0 0}
  .rapidos button{flex:1;background:rgba(74,139,59,.1);color:var(--tinta);border-radius:11px;padding:11px 0;
        font-weight:600;font-size:14.5px}
  .rapidos button:active{background:rgba(74,139,59,.22)}

  .teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 0}
  .teclado button{background:var(--papel-alto);border:1px solid var(--linea);border-radius:12px;
        padding:15px 0;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
  .teclado button:active{background:rgba(14,59,50,.07)}
  .teclado .aux{font-size:14.5px;font-weight:600;color:var(--tinta-suave)}
  .entrada{font-family:'Literata',Georgia,serif;font-size:34px;font-weight:600;text-align:center;
        padding:10px 0 2px;font-variant-numeric:tabular-nums;min-height:52px}
  .entrada.vacio{color:var(--gris)}

  .cta{display:block;width:100%;background:var(--tinta);color:var(--papel-alto);border-radius:13px;
       padding:16px;font-weight:600;font-size:16px;margin:14px 0 0;box-shadow:var(--sombra)}

  .cta.sec{background:transparent;color:var(--tinta-suave);box-shadow:none;border:1px solid var(--linea);
       font-weight:500;font-size:14.5px;padding:13px}

  .ritmo{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0 0}
  .ritmo div{background:var(--papel-alto);border:1px solid var(--linea);border-radius:12px;padding:12px 9px;
        text-align:center}
  .ritmo b{display:block;font-family:'Literata',Georgia,serif;font-size:19px;font-weight:600;
        font-variant-numeric:tabular-nums}
  .ritmo small{color:var(--gris);font-size:11.5px;line-height:1.3;display:block;margin-top:2px}

  /* ---------- Formulario ---------- */
  .campo{margin:0 0 14px}
  .campo label{display:block;font-size:13.5px;font-weight:500;color:var(--tinta-suave);margin:0 0 6px}
  .campo input{width:100%;background:var(--papel-alto);border:1px solid var(--linea);border-radius:11px;
        padding:13px 14px;font-size:16px}
  .campo input:focus{outline:none;border-color:var(--hoja);box-shadow:0 0 0 3px rgba(74,139,59,.16)}
  .colores{display:flex;gap:9px;flex-wrap:wrap}

  /* ---------- Librería ---------- */
  .libreria{background:var(--tinta);color:var(--papel-alto);border-radius:18px;padding:20px;margin:30px 0 0}

  .pie{text-align:center;color:var(--gris);font-size:12.5px;padding:26px 0 30px;line-height:1.6}

  .vacio-msg{background:var(--papel-alto);border:1px dashed var(--linea);border-radius:var(--r);

<script>
/* Lógica pura fuera de Babel (patrón Limonada Web) */
window.BM = (function(){
  var K = 'lw_bookmark_';
  var VERSION = 3;

  var COLORES = ['#C0453C','#E8A93B','#3A6E9B','#0E3B32','#4A8B3B','#7B4B8A','#B5652F','#2C5C51'];

  function hoy(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
  function iso(d){ return d.toISOString().slice(0,10); }
  function diasAtras(n){ var d=hoy(); d.setDate(d.getDate()-n); return iso(d); }

  function semilla(){
    return {
      version: VERSION,
      libreria: { nombre:'Librería La Alameda', ciudad:'Málaga', whatsapp:'34600000000' },
      libros:[
        { id:'l1', titulo:'El infinito en un junco', autor:'Irene Vallejo', total:452, pagina:187,
          color:'#C0453C', estado:'en_curso',
          sesiones:[{f:diasAtras(9),p:40},{f:diasAtras(6),p:88},{f:diasAtras(4),p:121},
                    {f:diasAtras(2),p:156},{f:diasAtras(1),p:187}] },
        { id:'l2', titulo:'Patria', autor:'Fernando Aramburu', total:648, pagina:34,
          color:'#3A6E9B', estado:'en_curso',
          sesiones:[{f:diasAtras(3),p:12},{f:diasAtras(1),p:34}] },
        { id:'l3', titulo:'Sapiens', autor:'Yuval Noah Harari', total:496, pagina:311,
          color:'#E8A93B', estado:'en_curso',
          sesiones:[{f:diasAtras(14),p:210},{f:diasAtras(8),p:265},{f:diasAtras(5),p:311}] },
        { id:'l4', titulo:'La sombra del viento', autor:'Carlos Ruiz Zafón', total:576, pagina:576,
          color:'#0E3B32', estado:'terminado',
          sesiones:[{f:diasAtras(40),p:300},{f:diasAtras(28),p:576}] },
        { id:'l5', titulo:'Los renglones torcidos de Dios', autor:'Torcuato Luca de Tena', total:496, pagina:0,
          color:'#7B4B8A', estado:'pendiente', sesiones:[] }
      ],
      novedades:[
        { titulo:'Las hijas de la criada', autor:'Sonsoles Ónega', color:'#B5652F' },
        { titulo:'Los pacientes del doctor García', autor:'Almudena Grandes', color:'#2C5C51' }
      ]
    };
  }

  function cargar(){
    try{
      var raw = localStorage.getItem(K+'datos');
      if(!raw) return semilla();
      var d = JSON.parse(raw);
      if(!d || d.version !== VERSION) return semilla();
      return d;
    }catch(e){ return semilla(); }
  }

  function guardar(d){
    try{ localStorage.setItem(K+'datos', JSON.stringify(d)); }catch(e){}
  }

  function reiniciar(){
    try{ localStorage.removeItem(K+'datos'); }catch(e){}
  }

  /* Racha: días consecutivos con lectura, contando desde hoy o ayer */
  function racha(libros){
    var set = {};
    libros.forEach(function(l){ (l.sesiones||[]).forEach(function(s){ set[s.f]=true; }); });
    var dias = Object.keys(set).sort().reverse();
    if(!dias.length) return 0;
    if(dias[0] !== iso(hoy()) && dias[0] !== diasAtras(1)) return 0;
    var n = 0, cursor = new Date(dias[0]+'T00:00:00');
    while(set[iso(cursor)]){ n++; cursor.setDate(cursor.getDate()-1); }
    return n;
  }

  /* Media de páginas por sesión en los últimos 30 días */
  function ritmo(libro){
    var ses = (libro.sesiones||[]).slice(-8);
    if(ses.length < 2) return 0;
    var total = 0, cuenta = 0, prev = null;
    ses.forEach(function(s){
      if(prev !== null && s.p > prev){ total += (s.p - prev); cuenta++; }
      prev = s.p;
    });
    return cuenta ? Math.round(total/cuenta) : 0;
  }

  function finEstimado(libro){
    var r = ritmo(libro);
    if(!r || !libro.total || libro.pagina >= libro.total) return null;
    var sesionesRestantes = Math.ceil((libro.total - libro.pagina)/r);
    var d = hoy(); d.setDate(d.getDate() + sesionesRestantes * 2);
    return d.toLocaleDateString('es-ES',{day:'numeric',month:'long'});
  }

  function saludo(){
    var h = new Date().getHours();
    if(h < 6)  return 'Se ha hecho de noche leyendo.';
    if(h < 13) return 'Buenos días. ¿Seguimos?';
    if(h < 20) return 'Buenas tardes. ¿Por dónde ibas?';
    return 'Buenas noches. Un rato de lectura.';
  }

  function marcar(datos, id, pagina){
    var libros = datos.libros.map(function(l){
      if(l.id !== id) return l;
      var ses = (l.sesiones||[]).filter(function(s){ return s.f !== iso(hoy()); });
      ses.push({ f: iso(hoy()), p: pagina });
      var estado = l.estado;
      if(l.total && pagina >= l.total) estado = 'terminado';
      else if(estado !== 'en_curso') estado = 'en_curso';
      return Object.assign({}, l, { pagina: pagina, estado: estado, sesiones: ses });
    });
    return Object.assign({}, datos, { libros: libros });
  }

  function anadir(datos, libro){
    var nuevo = {
      id: 'l' + Date.now().toString(36),
      titulo: libro.titulo,
      autor: libro.autor || '',
      total: libro.total || 0,
      pagina: 0,
      color: libro.color || COLORES[0],
      estado: 'en_curso',
      sesiones: []
    };
    return Object.assign({}, datos, { libros: datos.libros.concat([nuevo]) });
  }

  function eliminar(datos, id){
    return Object.assign({}, datos, {
      libros: datos.libros.filter(function(l){ return l.id !== id; })
    });
  }

  return {
    COLORES: COLORES, cargar: cargar, guardar: guardar, reiniciar: reiniciar,
    racha: racha, ritmo: ritmo, finEstimado: finEstimado, saludo: saludo,
    marcar: marcar, anadir: anadir, eliminar: eliminar
  };
})();
</script>
