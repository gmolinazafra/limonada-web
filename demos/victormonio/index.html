// ══ BOOKING UTILS ══

function timeToMinutes(t) { const [h,m] = t.split(":").map(Number); return h*60+m; }
function minutesToTime(m) { return `${Math.floor(m/60).toString().padStart(2,"0")}:${(m%60).toString().padStart(2,"0")}`; }
function getDayOfWeek(dateStr) { return new Date(dateStr+"T12:00:00").getDay(); }
const todayNow = new Date();
function isToday(d) { return d===todayStr; }
function isTomorrow(d) { return d===tomorrowStr; }
function formatDateLabel(d) {
  if(isToday(d)) return "Hoy";
  if(isTomorrow(d)) return "Mañana";
  return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
}
function formatDateShort(d) { return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"long"}); }
function generateBookingCode() { return "VM-"+Math.random().toString(36).substring(2,7).toUpperCase(); }

function getAvailableSlots(date, professionalId, serviceDuration, appointments) {
  const dow = getDayOfWeek(date);
  const prof = professionals.find(p=>p.id===professionalId);
  if(!prof) return [];
  const sched = prof.schedule[dow];
  if(!sched) return [];
  const ranges = Array.isArray(sched)?sched:[sched];
  const busy = appointments
    .filter(a=>a.date===date&&a.professionalId===professionalId&&a.status!=="cancelled")
    .map(a=>({start:timeToMinutes(a.time),end:timeToMinutes(a.time)+a.duration}));
  const slots=[];
  for(const r of ranges){
    let cur=timeToMinutes(r.open);
    const end=timeToMinutes(r.close);
    while(cur+serviceDuration<=end){
      const se=cur+serviceDuration;
      if(!busy.some(b=>cur<b.end&&se>b.start)) slots.push(minutesToTime(cur));
      cur+=15;
    }
  }
  return slots;
}

// ══ USE SWIPE ══
function useSwipe(onSwipeLeft, onSwipeRight, threshold = 50) {
  const touchStart = { x: 0, y: 0 };
  function onTouchStart(e) {
    touchStart.x = e.touches[0].clientX;
    touchStart.y = e.touches[0].clientY;
  }
  function onTouchEnd(e) {
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < threshold || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx < 0) onSwipeLeft(); else onSwipeRight();
  }
  return { onTouchStart, onTouchEnd };
}

function DemoBanner({label,onBack,onReset}){
  return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:300,background:'rgba(17,17,17,0.96)',backdropFilter:'blur(10px)',borderBottom:`1px solid ${T.goldBorder}`,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 16px',maxWidth:860,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span style={{background:T.gold,color:'#fff',fontSize:9,fontWeight:800,padding:'2px 9px',borderRadius:20,letterSpacing:1.2,textTransform:'uppercase'}}>DEMO</span>
        <span style={{fontSize:12,color:'rgba(255,255,255,0.5)'}}>{label}</span>
      </div>
      <div style={{display:'flex',gap:8}}>
        {onReset&&<button onClick={onReset} style={{background:'none',border:`1px solid ${T.goldBorder}`,borderRadius:8,padding:'4px 11px',color:T.gold,fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Restablecer</button>}

      </div>
    </div>
  );
}

// ── NAVIGATION ──
function BottomNav({active,onNav}){
  const items=[
    {id:'home',    icon:'⌂',  label:'Inicio'},
    {id:'services',icon:'✂',  label:'Servicios'},
    {id:'booking', icon:'+',  label:'Reservar', cta:true},
    {id:'appointments',icon:'◫',label:'Mis citas'},
    {id:'profile', icon:'◎', label:'Perfil'},
  ];
  return(
    <div style={{position:'fixed',bottom:0,left:0,right:0,background:T.bgCard,borderTop:'1px solid rgba(0,0,0,0.07)',display:'flex',zIndex:100,maxWidth:860,margin:'0 auto',boxShadow:'0 -4px 20px rgba(0,0,0,0.06)'}}>
      {items.map(item=>{
        const isActive=active===item.id;
        if(item.cta) return(
          <button key={item.id} onClick={()=>onNav(item.id)} style={{flex:1,border:'none',background:'none',padding:'8px 4px 14px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontFamily:'inherit'}}>
            <div style={{width:46,height:46,borderRadius:'50%',background:T.ink,display:'flex',alignItems:'center',justifyContent:'center',marginTop:-20,boxShadow:'0 4px 16px rgba(0,0,0,0.22)'}}>
              <span style={{fontSize:22,color:'#fff',lineHeight:1,fontWeight:300}}>+</span>
            </div>
            <span style={{fontSize:10,fontWeight:600,color:T.ink3,marginTop:2}}>Reservar</span>
          </button>
        );
        return(
          <button key={item.id} onClick={()=>onNav(item.id)} style={{flex:1,border:'none',background:'none',padding:'10px 4px 14px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,fontFamily:'inherit'}}>
            <span style={{fontSize:18,color:isActive?T.ink:T.ink3,lineHeight:1}}>{item.icon}</span>
            <span style={{fontSize:10,fontWeight:isActive?700:500,color:isActive?T.ink:T.ink3,letterSpacing:.2}}>{item.label}</span>
            {isActive&&<div style={{width:18,height:2,background:T.gold,borderRadius:2,marginTop:1}}/>}
          </button>
        );
      })}
    </div>
  );
}

function StyleBot({onReservar}){
  const [open,setOpen]=useState(false);
  const [step,setStep]=useState(0);
  const [answers,setAnswers]=useState({});
  const [result,setResult]=useState(null);
  const questions=[
    {q:'¿Qué buscas hoy?',opts:['Corte de pelo','Corte + barba','Solo barba','Color o mechas','Cejas o pestañas']},
    {q:'¿Tienes preferencia de barbero?',opts:['El primero libre','Víctor','Miguel','Álex','Sara o Lucía']},
    {q:'¿Cuánto tiempo tienes?',opts:['Menos de 30 min','30–45 min','45–60 min','Sin límite']},
  ];
  function handleAnswer(ans){
    const na={...answers,[step]:ans};
    setAnswers(na);
    if(step<questions.length-1){setStep(step+1);}
    else{
      let rec={service:'Corte + Barba',professional:'Miguel',duration:'45 min',price:'27 €'};
      if(na[0]==='Solo barba') rec={service:'Arreglo de barba',professional:'Víctor',duration:'20 min',price:'14 €'};
      else if(na[0]==='Corte + barba'&&na[2]==='Sin límite') rec={service:'La experiencia completa',professional:'Víctor',duration:'75 min',price:'48 €'};
      else if(na[0]==='Color o mechas') rec={service:'Balayage',professional:'Sara',duration:'2 horas',price:'Desde 90 €'};
      else if(na[0]==='Cejas o pestañas') rec={service:'Laminado de cejas',professional:'Lucía',duration:'45 min',price:'38 €'};
      else if(na[2]==='Menos de 30 min') rec={service:'Corte hombre',professional:'Álex',duration:'30 min',price:'17 €'};
      setResult(rec);
    }
  }
  function reset(){setStep(0);setAnswers({});setResult(null);}
  return(
    <>
      <button onClick={()=>setOpen(!open)} aria-label="Style Bot"
        style={{position:'fixed',bottom:88,right:20,width:52,height:52,borderRadius:'50%',background:T.ink,border:`2px solid ${T.gold}`,padding:0,cursor:'pointer',boxShadow:'0 6px 20px rgba(0,0,0,0.22)',zIndex:900,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,color:T.gold}}>✦</button>
      {open&&(
        <div style={{position:'fixed',bottom:152,right:20,width:290,background:T.bgCard,borderRadius:T.radiusLg,boxShadow:T.shadowMd,zIndex:901,overflow:'hidden',border:'1px solid rgba(0,0,0,0.07)'}}>
          <div style={{background:T.bgDark,padding:'14px 18px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div>
              <p style={{margin:0,fontSize:13,fontWeight:800,color:'#fff',letterSpacing:.3}}>STYLE BOT</p>
              <p style={{margin:0,fontSize:11,color:T.gold}}>Te ayudo a elegir</p>
            </div>
            <button onClick={()=>{setOpen(false);reset();}} style={{background:'none',border:'none',color:'rgba(255,255,255,0.35)',fontSize:18,cursor:'pointer',lineHeight:1}}>×</button>
          </div>
          <div style={{padding:16}}>
            {!result?(
              <>
                <div style={{marginBottom:10}}>
                  <div style={{height:2,background:'rgba(0,0,0,0.06)',borderRadius:1}}>
                    <div style={{height:'100%',width:`${((step+1)/questions.length)*100}%`,background:T.gold,borderRadius:1,transition:'width .3s'}}/>
                  </div>
                </div>
                <p style={{fontSize:13,fontWeight:700,color:T.ink,marginBottom:10,lineHeight:1.4}}>{questions[step].q}</p>
                {questions[step].opts.map(o=>(
                  <button key={o} onClick={()=>handleAnswer(o)}
                    style={{display:'block',width:'100%',background:T.bg,border:'1px solid rgba(0,0,0,0.08)',borderRadius:T.radiusSm,padding:'9px 13px',fontSize:13,textAlign:'left',cursor:'pointer',marginBottom:6,fontFamily:'inherit',color:T.ink,transition:'background .15s'}}
                    onMouseEnter={e=>e.currentTarget.style.background='#EDE9E2'}
                    onMouseLeave={e=>e.currentTarget.style.background=T.bg}
                  >{o}</button>
                ))}
              </>
            ):(
              <div>
                <p style={{fontSize:11,color:T.ink3,margin:'0 0 10px',fontWeight:600,textTransform:'uppercase',letterSpacing:1}}>Mi recomendación</p>
                <div style={{background:T.bgDark,borderRadius:T.radiusSm,padding:14,marginBottom:12}}>
                  <p style={{margin:'0 0 3px',fontWeight:800,fontSize:15,color:'#fff'}}>{result.service}</p>
                  <p style={{margin:'0 0 2px',fontSize:12,color:'rgba(255,255,255,0.45)'}}>con {result.professional}</p>
                  <p style={{margin:0,fontSize:12,color:T.gold,fontWeight:600}}>{result.duration} · {result.price}</p>
                </div>

function BookingView({appointments,onAppointmentCreated,initialService}){
  const [step,setStep]=useState(initialService?1:0);
  const [selectedService,setSelectedService]=useState(initialService||null);
  const [selectedExtras,setSelectedExtras]=useState([]);
  const [selectedProfessional,setSelectedProfessional]=useState(null);
  const [selectedDate,setSelectedDate]=useState(null);
  const [selectedTime,setSelectedTime]=useState(null);
  const [clientName,setClientName]=useState("");
  const [clientPhone,setClientPhone]=useState("");
  const [clientEmail,setClientEmail]=useState("");
  const [notes,setNotes]=useState("");
  const [privacyOk,setPrivacyOk]=useState(false);
  const [confirmResult,setConfirmResult]=useState(null);
  const [error,setError]=useState("");
  const [search,setSearch]=useState("");

  const totalDuration=useMemo(()=>!selectedService?0:selectedService.duration+selectedExtras.reduce((s,eid)=>s+(extrasData[eid]?.duration||0),0),[selectedService,selectedExtras]);
  const totalPrice=useMemo(()=>!selectedService?0:selectedService.price+selectedExtras.reduce((s,eid)=>s+(extrasData[eid]?.price||0),0),[selectedService,selectedExtras]);

  const availableSlots=useMemo(()=>{
    if(!selectedDate||!selectedProfessional||selectedProfessional.id==="any") return [];
    return getAvailableSlots(selectedDate,selectedProfessional.id,totalDuration,appointments);
  },[selectedDate,selectedProfessional,totalDuration,appointments]);

  const compatibleProfs=useMemo(()=>!selectedService?professionals:professionals.filter(p=>p.serviceIds.includes(selectedService.id)),[selectedService]);

  const availableDates=useMemo(()=>{
    const dates=[];
    for(let i=0;i<14;i++){
      const d=new Date(todayNow.getTime()+i*86400000);
      const dStr=d.toISOString().split("T")[0];
      if(businessConfig.schedule[d.getDay()]) dates.push(dStr);
    }
    return dates;
  },[]);

  function toggleExtra(eid){setSelectedExtras(p=>p.includes(eid)?p.filter(e=>e!==eid):[...p,eid]);}

  function handleConfirm(){
    if(!clientName.trim()||!clientPhone.trim()||!privacyOk){setError("Completa nombre, teléfono y acepta la política de privacidad.");return;}
    setError("");
    const profId=selectedProfessional.id==="any"
      ?compatibleProfs.find(p=>getAvailableSlots(selectedDate,p.id,totalDuration,appointments).includes(selectedTime))?.id
      :selectedProfessional.id;
    if(!profId){setError("No se encontró disponibilidad. Por favor elige otra hora.");return;}
    const current=getAvailableSlots(selectedDate,profId,totalDuration,appointments);
    if(!current.includes(selectedTime)){setError("Este horario acaba de ser reservado. Elige otro.");setStep(3);return;}
    const newApt={id:"apt"+Date.now(),date:selectedDate,time:selectedTime,professionalId:profId,serviceId:selectedService.id,clientName,clientPhone,clientEmail,notes,status:"confirmed",duration:totalDuration,price:totalPrice,code:generateBookingCode()};
    onAppointmentCreated(newApt);
    setConfirmResult(newApt);
    setStep(6);
  }

  function reset(){setStep(0);setSelectedService(null);setSelectedExtras([]);setSelectedProfessional(null);setSelectedDate(null);setSelectedTime(null);setClientName("");setClientPhone("");setClientEmail("");setNotes("");setPrivacyOk(false);setConfirmResult(null);setError("");}

  const SI=({current,total})=>(
    <div style={{display:"flex",gap:5,padding:"0 20px 16px"}}>
      {Array.from({length:total}).map((_,i)=>(
        <div key={i} style={{flex:1,height:3,borderRadius:2,background:i<current?"#1a1a1a":i===current?"#B89A5A":"#F0EDE8",transition:"background 0.3s"}}/>
      ))}
    </div>
  );

  if(step===6&&confirmResult){
    const prof=professionals.find(p=>p.id===confirmResult.professionalId);
    const svc=services.find(s=>s.id===confirmResult.serviceId);
    return(
      <div style={{padding:20,paddingBottom:80,textAlign:"center"}}>
        <div style={{background:"#111",borderRadius:20,padding:"40px 20px",marginBottom:20,color:"#fff"}}>
          <div style={{width:60,height:60,borderRadius:"50%",background:"rgba(184,154,90,0.15)",border:"2px solid #B89A5A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 16px",color:"#B89A5A"}}>✓</div>
          <h2 style={{margin:"0 0 8px",fontSize:24,fontWeight:800}}>¡Cita reservada!</h2>
          <p style={{margin:"0 0 20px",color:"#666",fontSize:14}}>Te esperamos en Victor Monió Barbería</p>
          <div style={{background:"rgba(184,154,90,0.1)",border:"1px solid rgba(184,154,90,0.3)",borderRadius:12,padding:"14px 20px",marginBottom:16}}>
            <p style={{margin:0,fontSize:12,color:"#B89A5A"}}>Código de reserva</p>
            <p style={{margin:"4px 0 0",fontSize:22,fontWeight:800,letterSpacing:3,color:"#B89A5A"}}>{confirmResult.code}</p>
          </div>
          <div style={{textAlign:"left"}}>
            {[["Servicio",svc?.name],["Profesional",prof?.name],["Fecha",formatDateShort(confirmResult.date)],["Hora",confirmResult.time],["Duración",`${confirmResult.duration} min`],["Precio",`${confirmResult.price} €`]].map(([l,v])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
                <span style={{fontSize:13,color:"#666"}}>{l}</span>
                <span style={{fontSize:13,fontWeight:700}}>{v}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Btn variant="primary" style={{width:"100%"}} onClick={()=>{}}>Añadir al calendario</Btn>
          <Btn variant="outline" style={{width:"100%"}} onClick={()=>{}}>Cómo llegar</Btn>

        </div>
        <p style={{fontSize:11,color:"#aaa",marginTop:16,lineHeight:1.7}}>Cancelación gratuita hasta 24h antes de la cita.</p>
      </div>
    );
  }

  return(
    <div style={{paddingBottom:80}}>
      <div style={{padding:"24px 20px 12px"}}>
        <h2 style={{margin:0,fontSize:20,fontWeight:800}}>Reservar cita</h2>
      </div>
      <SI current={step} total={6}/>

      {/* PASO 0 */}
      {step===0&&(
        <div style={{padding:"0 20px"}}>
          <p style={{fontSize:13,color:"#888",marginBottom:16}}>¿Qué servicio necesitas?</p>
          <div style={{position:"relative",marginBottom:16}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar..." style={{width:"100%",padding:"11px 16px 11px 40px",border:"1.5px solid #E8E8E8",borderRadius:12,fontSize:14,fontFamily:"inherit",background:"#F8F7F5",outline:"none",boxSizing:"border-box"}}/>
            <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"#aaa"}}>🔍</span>
          </div>
          {categories.map(cat=>{
            const cs=services.filter(s=>s.cat===cat.id&&(!search||s.name.toLowerCase().includes(search.toLowerCase())));
            if(!cs.length) return null;
            return(
              <div key={cat.id} style={{marginBottom:20}}>
                <p style={{margin:"0 0 8px",fontSize:11,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:1}}>{cat.name}</p>

                    <span style={{fontSize:15,fontWeight:800}}>{s.priceFrom&&<span style={{fontSize:11,color:"#888",fontWeight:400}}>desde </span>}{s.price} €</span>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {/* PASO 1 */}
      {step===1&&selectedService&&(

    const prof=professionals.find(p=>p.id===apt.professionalId);

        </div>
        <Divider/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[["Fecha",formatDateLabel(apt.date)],["Hora",apt.time],["Duración",`${apt.duration} min`],["Precio",`${apt.price} €`]].map(([l,v])=>(
            <div key={l}><p style={{margin:0,fontSize:11,color:"#aaa"}}>{l}</p><p style={{margin:"2px 0 0",fontSize:13,fontWeight:700}}>{v}</p></div>

function AdminStats({appointments}){
  const totalRevenue=appointments.filter(a=>a.status!=="cancelled").reduce((s,a)=>s+a.price,0);
  const byService={};
  appointments.forEach(a=>{const svc=services.find(s=>s.id===a.serviceId);const n=svc?.name||a.serviceId;byService[n]=(byService[n]||0)+1;});
  const topServices=Object.entries(byService).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const byProf={};
  appointments.filter(a=>a.status!=="cancelled").forEach(a=>{const p=professionals.find(pr=>pr.id===a.professionalId);byProf[p?.name||a.professionalId]=(byProf[p?.name||a.professionalId]||0)+1;});
  return(
    <div style={{padding:20}}>
      <h3 style={{margin:"0 0 16px",fontSize:16,fontWeight:800}}>Estadísticas</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
        {[{l:"Facturación",v:`${totalRevenue} €`,c:"#B89A5A"},{l:"Citas",v:appointments.filter(a=>a.status!=="cancelled").length,c:"#4CAF50"},{l:"Ticket medio",v:`${Math.round(totalRevenue/Math.max(1,appointments.filter(a=>a.status!=="cancelled").length))} €`,c:"#1a1a1a"},{l:"Tasa cancel.",v:"0%",c:"#E74C3C"}].map(s=>(
          <Card key={s.l} style={{textAlign:"center"}}><p style={{margin:"0 0 4px",fontSize:10,color:"#aaa",textTransform:"uppercase",letterSpacing:1}}>{s.l}</p><p style={{margin:0,fontSize:22,fontWeight:800,color:s.c}}>{s.v}</p></Card>
        ))}
      </div>
      <Card style={{marginBottom:16}}>
        <p style={{margin:"0 0 12px",fontSize:13,fontWeight:800}}>Servicios más solicitados</p>
        {topServices.map(([name,count])=>(
          <div key={name}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:13,color:"#444"}}>{name}</span><span style={{fontSize:13,fontWeight:700}}>{count}</span></div>
            <div style={{height:5,background:"#F0EDE8",borderRadius:3,marginBottom:10}}><div style={{height:"100%",width:`${(count/(topServices[0][1]||1))*100}%`,background:"#B89A5A",borderRadius:3}}/></div>
          </div>
        ))}
      </Card>
      <Card>
        <p style={{margin:"0 0 12px",fontSize:13,fontWeight:800}}>Por profesional</p>
        {Object.entries(byProf).sort((a,b)=>b[1]-a[1]).map(([name,count])=>{
          const p=professionals.find(pr=>pr.name===name);
          return(
            <div key={name} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
              <Avatar initials={p?.avatar||name[0]} size={36}/>
              <div style={{flex:1}}><p style={{margin:0,fontSize:13,fontWeight:700}}>{name}</p><div style={{height:4,background:"#F0EDE8",borderRadius:2,marginTop:4}}><div style={{height:"100%",width:`${(count/appointments.length)*100}%`,background:"#1a1a1a",borderRadius:2}}/></div></div>
              <span style={{fontSize:13,fontWeight:800}}>{count}</span>

          );
        })}
      </Card>
    </div>
  );
}

// ══ CLIENT APP ══

function ClientApp({ appointments, onAppointmentCreated, demoMode=false, onExitDemo }){
  const [clientNav,setClientNav]=useState("home");
  const [bookingService,setBookingService]=useState(null);
  const [user,setUser]=useState(demoMode?{name:"Demo",phone:"000000000"}:null);
  const [loginContext,setLoginContext]=useState("appointments");
  const [showLogin,setShowLogin]=useState(false);
  const [slideDir,setSlideDir]=useState(null);
  const [animKey,setAnimKey]=useState(0);

  const TAB_ORDER=["home","services","booking","appointments","profile"];

  function handleNavWithReset(view,dir=null){
    if(view!=="booking") setBookingService(null);
    if(!demoMode&&(view==="appointments"||view==="profile")&&!user){
      setLoginContext(view); setShowLogin(true); return;
    }
    setShowLogin(false);
    if(dir){setSlideDir(dir);setAnimKey(k=>k+1);}
    setClientNav(view);
  }
  function handleSwipeLeft(){
    if(showLogin) return;
    const cur=TAB_ORDER.indexOf(clientNav);
    if(cur<TAB_ORDER.length-1) handleNavWithReset(TAB_ORDER[cur+1],"left");
  }
  function handleSwipeRight(){
    if(showLogin) return;
    const cur=TAB_ORDER.indexOf(clientNav);
    if(cur>0) handleNavWithReset(TAB_ORDER[cur-1],"right");
  }
  const swipeHandlers=useSwipe(handleSwipeLeft,handleSwipeRight);

  const slideStyle=slideDir?{animation:`slideIn${slideDir==="left"?"Left":"Right"} 0.28s cubic-bezier(0.25,0.46,0.45,0.94) both`}:{};
  const topPad=demoMode?44:0;

  return(
    <div style={{fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",maxWidth:860,margin:"0 auto",background:"#F8F7F5",minHeight:"100vh",overflow:"hidden"}}>
      <style>{`
        @keyframes slideInLeft{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes slideInRight{from{transform:translateX(-40px);opacity:0}to{transform:translateX(0);opacity:1}}
      `}</style>

      {demoMode&&<DemoBanner label="Estás probando la app como cliente" onBack={onExitDemo}/>}

      {showLogin?(
        <div style={{paddingTop:topPad}}>
          <LoginView context={loginContext} onLogin={u=>{setUser(u);setShowLogin(false);setClientNav(loginContext);}} onBack={()=>{setShowLogin(false);setClientNav("home");}}/>
        </div>
      ):(
        <div key={animKey} style={{...slideStyle,minHeight:"100vh",paddingTop:topPad}} {...swipeHandlers}>
          {clientNav==="home"&&<HomeView onNav={handleNavWithReset} appointments={appointments} onReservar={()=>setClientNav("booking")}/>}
          {clientNav==="services"&&<ServicesView onBookService={s=>{setBookingService(s);setClientNav("booking");}}/>}
          {clientNav==="booking"&&<BookingView key={bookingService?.id||"booking"} appointments={appointments} onAppointmentCreated={onAppointmentCreated} initialService={bookingService}/>}
          {clientNav==="appointments"&&<AppointmentsView appointments={appointments}/>}
          {clientNav==="profile"&&(user?<ProfileViewLoggedIn user={user} onLogout={()=>{if(!demoMode){setUser(null);setClientNav("home");}}}/>:<ProfileView/>)}
        </div>
      )}
      <BottomNav active={showLogin?loginContext:clientNav} onNav={v=>handleNavWithReset(v)}/>
    </div>
  );
}

function HamburgerMenu({onClient,onDemo,onBusiness}){
  const [open,setOpen]=useState(false);
  return(
    <div style={{position:'fixed',top:0,right:0,zIndex:600}}>
      <button onClick={()=>setOpen(!open)} aria-label="Menú"
        style={{background:T.bgCard,border:'none',borderLeft:'1px solid rgba(0,0,0,0.08)',borderBottom:'1px solid rgba(0,0,0,0.08)',borderBottomLeftRadius:10,padding:'12px 14px',cursor:'pointer',display:'flex',flexDirection:'column',gap:5,alignItems:'center',boxShadow:'0 2px 10px rgba(0,0,0,0.06)'}}>
        <span style={{display:'block',width:20,height:2,background:T.ink,transition:'all .2s',transform:open?'rotate(45deg) translate(4px,5px)':'none'}}/>
        <span style={{display:'block',width:20,height:2,background:T.ink,opacity:open?0:1,transition:'opacity .15s'}}/>
        <span style={{display:'block',width:20,height:2,background:T.ink,transition:'all .2s',transform:open?'rotate(-45deg) translate(4px,-5px)':'none'}}/>
      </button>
      {open&&(
        <>
          <div onClick={()=>setOpen(false)} style={{position:'fixed',inset:0,zIndex:-1}}/>
          <div style={{position:'absolute',top:'100%',right:0,background:T.bgCard,border:'1px solid rgba(0,0,0,0.07)',borderRadius:'0 0 0 14px',overflow:'hidden',minWidth:220,boxShadow:T.shadowMd}}>
            {[
              {label:'Vista Cliente',desc:'App de reservas',icon:'◎',action:()=>{onClient();setOpen(false);}},
              {label:'Ver Demo',desc:'Selector de vista',icon:'✦',action:()=>{onDemo();setOpen(false);}},
              {label:'Panel Peluquería',desc:'Gestión del negocio',icon:'◫',action:()=>{onBusiness();setOpen(false);}},
            ].map((item,i,arr)=>(
              <button key={item.label} onClick={item.action}
                style={{display:'block',width:'100%',background:'none',border:'none',borderBottom:i<arr.length-1?'1px solid rgba(0,0,0,0.05)':'none',padding:'13px 18px',textAlign:'left',cursor:'pointer',fontFamily:'inherit',transition:'background .12s'}}
                onMouseEnter={e=>e.currentTarget.style.background=T.bg}
                onMouseLeave={e=>e.currentTarget.style.background='none'}
              >
                <div style={{display:'flex',alignItems:'center',gap:12}}>
                  <span style={{fontSize:15,color:T.gold,width:22,flexShrink:0}}>{item.icon}</span>
                  <div>
                    <p style={{margin:0,fontSize:13,fontWeight:700,color:T.ink}}>{item.label}</p>
                    <p style={{margin:'1px 0 0',fontSize:11,color:T.ink3}}>{item.desc}</p>
                  </div>
                </div>
              </button>
            ))}
            <div style={{padding:'8px 18px 10px',borderTop:'1px solid rgba(0,0,0,0.05)',background:T.bg}}>
              <p style={{margin:0,fontSize:10,color:T.ink3,letterSpacing:1.2,textTransform:'uppercase'}}>Demo · Limonada Web</p>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function App(){
  const [mode,setMode]=useState('demoClient');
  const [appointments,setAppointments]=useState(initialAppointments);
  function handleAppointmentCreated(apt){setAppointments(p=>[...p,apt]);}
  function handleResetDemo(){setAppointments(initialAppointments);}
  const menu=<HamburgerMenu onClient={()=>setMode('demoClient')} onDemo={()=>setMode('demo')} onBusiness={()=>setMode('demoBusiness')}/>;
  return(
    <div style={{fontFamily:F,background:'#E8E4DD',minHeight:'100vh'}}>
      {menu}
      <div style={{maxWidth:860,margin:'0 auto',background:T.bg,minHeight:'100vh',boxShadow:'0 0 60px rgba(0,0,0,0.07)'}}>
        {mode==='demo'          && <DemoPortal onDemoClient={()=>setMode('demoClient')} onDemoBusiness={()=>setMode('demoBusiness')} onBack={()=>setMode('demoClient')}/>}
        {mode==='demoClient'    && <ClientApp appointments={appointments} onAppointmentCreated={handleAppointmentCreated} demoMode={true} onExitDemo={()=>setMode('demo')}/>}
        {mode==='demoBusiness'  && <BusinessApp appointments={appointments} onAppointmentCreated={handleAppointmentCreated} demoMode={true} onExitDemo={()=>setMode('demo')} onReset={handleResetDemo}/>}
        {mode==='businessLogin' && <BusinessLogin onLogin={()=>setMode('demoBusiness')} onDemoAccess={()=>setMode('demoBusiness')} onBack={()=>setMode('demoClient')}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(

);
