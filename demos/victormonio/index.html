// UTILS

function timeToMinutes(t) { const [h,m] = t.split(":").map(Number); return h*60+m; }
function minutesToTime(m) { return `${Math.floor(m/60).toString().padStart(2,"0")}:${(m%60).toString().padStart(2,"0")}`; }
function getDayOfWeek(dateStr) { return new Date(dateStr+"T12:00:00").getDay(); }
const todayNow = new Date();
function isToday(d) { return d===todayStr; }
function isTomorrow(d) { return d===tomorrowStr; }
function formatDateLabel(d) {
  if(isToday(d)) return "Hoy";
  if(isTomorrow(d)) return "Mañana";
  return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
}
function formatDateShort(d) { return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"long"}); }
function generateBookingCode() { return "VM-"+Math.random().toString(36).substring(2,7).toUpperCase(); }

function getAvailableSlots(date, professionalId, serviceDuration, appointments) {
  const dow = getDayOfWeek(date);
  const prof = professionals.find(p=>p.id===professionalId);
  if(!prof) return [];
  const sched = prof.schedule[dow];
  if(!sched) return [];
  const ranges = Array.isArray(sched)?sched:[sched];
  const busy = appointments
    .filter(a=>a.date===date&&a.professionalId===professionalId&&a.status!=="cancelled")
    .map(a=>({start:timeToMinutes(a.time),end:timeToMinutes(a.time)+a.duration}));
  const slots=[];
  for(const r of ranges){
    let cur=timeToMinutes(r.open);
    const end=timeToMinutes(r.close);
    while(cur+serviceDuration<=end){
      const se=cur+serviceDuration;
      if(!busy.some(b=>cur<b.end&&se>b.start)) slots.push(minutesToTime(cur));
      cur+=15;
    }
  }
  return slots;
}

// SWIPE
function useSwipe(onSwipeLeft, onSwipeRight, threshold = 50) {
  const touchStart = { x: 0, y: 0 };
  function onTouchStart(e) {
    touchStart.x = e.touches[0].clientX;
    touchStart.y = e.touches[0].clientY;
  }
  function onTouchEnd(e) {
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < threshold || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx < 0) onSwipeLeft(); else onSwipeRight();
  }
  return { onTouchStart, onTouchEnd };
}

function SectionHero({height=220}){
  return(
    <div style={{height,backgroundImage:`url("${HERO_IMG}")`,backgroundSize:'cover',backgroundPosition:'center 35%',position:'relative',flexShrink:0}}>
      <div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.75) 100%)'}}/>
    </div>
  );
}



function Avatar({initials,bg='#2C2C2C',color='#B9924C',size=40}){
  return <div style={{width:size,height:size,borderRadius:'50%',background:bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*.32,fontWeight:700,color,flexShrink:0}}>{initials}</div>;
}
function Stars({rating,size=13}){
  const f=Math.floor(rating);
  return <span style={{color:T.gold,fontSize:size}}>{'★'.repeat(f)}{'☆'.repeat(5-f)}</span>;
}
function Badge({children,color=T.ink,bg='#F0EDE8'}){
  return <span style={{display:'inline-block',padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:600,background:bg,color}}>{children}</span>;
}
function Chip({children}){
  return <span style={{display:'inline-block',padding:'4px 11px',borderRadius:20,fontSize:11,fontWeight:500,background:'transparent',color:T.ink2,border:'1px solid rgba(0,0,0,0.13)'}}>{children}</span>;
}
function Btn({children,onClick,variant='primary',style={},disabled=false}){
  const v={primary:{background:T.ink,color:'#fff',padding:'13px 22px',border:'none'},gold:{background:T.gold,color:'#fff',padding:'13px 22px',border:'none'},outline:{background:'transparent',color:T.ink,padding:'11px 20px',border:`1.5px solid ${T.ink}`},ghost:{background:'transparent',color:T.ink2,padding:'10px 18px',border:'1px solid rgba(0,0,0,0.12)'},danger:{background:'#FEF0EF',color:T.err,padding:'11px 20px',border:`1.5px solid rgba(211,75,63,0.25)`}};
  return <button onClick={onClick} disabled={disabled} style={{...v[variant],cursor:disabled?'not-allowed':'pointer',borderRadius:T.radiusSm,fontWeight:600,fontSize:14,fontFamily:'inherit',opacity:disabled?.45:1,...style}}>{children}</button>;
}
function Card({children,style={}}){
  return <div style={{background:T.bgCard,borderRadius:T.radius,padding:20,boxShadow:T.shadow,border:'1px solid rgba(0,0,0,0.045)',...style}}>{children}</div>;
}
function Divider({style={}}){
  return <div style={{height:1,background:'rgba(0,0,0,0.07)',margin:'14px 0',...style}}/>;
}
function Section({label,style={}}){
  return <p style={{margin:'0 0 12px',fontSize:10,fontWeight:700,color:T.ink3,textTransform:'uppercase',letterSpacing:1.6,...style}}>{label}</p>;
}
function BusinessHeader({isOpen}){
  return(<div style={{backgroundImage:`url("${HERO_IMG}")`,backgroundSize:'cover',backgroundPosition:'center 20%',position:'relative',height:220}}><div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom,rgba(0,0,0,0.1) 0%,rgba(0,0,0,0.55) 100%)'}}/></div>);
}
function BusinessInfo({isOpen}){
  return(
    <div style={{background:T.bgCard,padding:'14px 16px',borderBottom:'1px solid rgba(0,0,0,0.06)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <span style={{width:7,height:7,borderRadius:'50%',background:isOpen?'#2F8F57':'#D34B3F',display:'inline-block'}}/>
          <span style={{fontSize:12,color:isOpen?'#2F8F57':'#D34B3F',fontWeight:700}}>{isOpen?'Abierto ahora':'Cerrado'}</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:4}}>
          <Stars rating={4.9} size={12}/>
          <span style={{fontSize:13,fontWeight:800,color:T.gold}}>4.9</span>
          <span style={{fontSize:11,color:T.ink3,marginLeft:2}}>487 resenas</span>
        </div>
      </div>
      <p style={{margin:'0 0 12px',fontSize:12,color:T.ink3}}>Calle Sta. Ana 11 · Cartama, Malaga</p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
        {[['Tel','Llamar'],['WA','WhatsApp'],['Map','Como llegar']].map(([ic,lb])=>(
          <button key={lb} style={{background:T.bg,border:'1px solid rgba(0,0,0,0.09)',borderRadius:T.radiusSm,padding:'8px 4px',color:T.ink2,fontSize:11,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>{ic} {lb}</button>
        ))}
      </div>
    </div>
  );
}

function DemoBanner(){return null;}
function LandingPage({onDemo,onClient,onBusiness}){
  return(
    <div style={{background:T.bg,minHeight:'100vh',fontFamily:F}}>
      <div style={{backgroundImage:`url("${HERO_IMG}")`,backgroundSize:'cover',backgroundPosition:'center 35%',position:'relative',padding:'80px 24px 48px',textAlign:'center'}}>
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.62)'}}/>
        <div style={{position:'relative',zIndex:1}}>
          <p style={{margin:'0 0 14px',fontSize:10,letterSpacing:3,color:T.gold,fontWeight:700,textTransform:'uppercase'}}>Para pelquerias y centros de belleza</p>
          <h1 style={{margin:'0 0 16px',fontSize:32,fontWeight:800,color:'#fff',lineHeight:1.15}}>Tu peluqueria<br/>en el movil<br/>de tus clientes</h1>
          <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:300,margin:'0 auto'}}>
            <button onClick={onDemo} style={{background:T.gold,border:'none',borderRadius:T.radiusSm,padding:'15px',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Ver demo completa</button>
            <button onClick={onBusiness} style={{background:'rgba(255,255,255,0.1)',border:'1px solid rgba(255,255,255,0.2)',borderRadius:T.radiusSm,padding:'13px',color:'rgba(255,255,255,0.8)',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Soy peluqueria</button>
          </div>
        </div>
      </div>
    </div>
  );
}
function DemoPortal({onDemoClient,onDemoBusiness,onBack}){
  const cf=['Buscar servicio','Elegir profesional','Ver disponibilidad','Reservar','Gestionar cita'];
  const bf=['Agenda','Reservas','Clientes','Estadisticas','Configuracion'];
  return(
    <div style={{minHeight:'100vh',background:T.bg}}>
      <div style={{backgroundImage:`url("${HERO_IMG}")`,backgroundSize:'cover',backgroundPosition:'center 35%',position:'relative',padding:'24px 24px 32px'}}>
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.72)'}}/>
        <div style={{position:'relative',zIndex:1}}>
          <button onClick={onBack} style={{background:'none',border:'none',color:T.gold,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit',marginBottom:20,padding:0}}>Volver</button>
          <h1 style={{margin:'0 0 6px',fontSize:24,fontWeight:800,color:'#fff',textAlign:'center'}}>Prueba la aplicacion</h1>
          <p style={{margin:0,fontSize:13,color:'rgba(255,255,255,0.4)',textAlign:'center'}}>Descubre como funcionaria en tu peluqueria.</p>
        </div>
      </div>
      <div style={{padding:'24px 20px',display:'flex',flexDirection:'column',gap:14}}>
        <div style={{background:T.bgCard,borderRadius:T.radiusLg,overflow:'hidden',boxShadow:T.shadow}}>
          <div style={{padding:'22px 22px 18px'}}>
            <p style={{margin:'0 0 4px',fontSize:10,fontWeight:700,letterSpacing:2,color:T.gold,textTransform:'uppercase'}}>Vista cliente</p>
            <p style={{margin:'0 0 8px',fontSize:20,fontWeight:800,color:T.ink}}>Como uno de tus clientes</p>
            <p style={{margin:'0 0 14px',fontSize:13,color:T.ink2,lineHeight:1.6}}>Realiza una reserva igual que lo haria cualquier cliente.</p>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{cf.map(f=><Chip key={f}>{f}</Chip>)}</div>
          </div>
          <button onClick={onDemoClient} style={{width:'100%',background:T.ink,border:'none',padding:'14px 22px',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}}>PROBAR APP CLIENTE</button>
        </div>
        <div style={{background:T.bgDark,borderRadius:T.radiusLg,overflow:'hidden'}}>
          <div style={{padding:'22px 22px 18px'}}>
            <p style={{margin:'0 0 4px',fontSize:10,fontWeight:700,letterSpacing:2,color:T.gold,textTransform:'uppercase'}}>Vista negocio</p>
            <p style={{margin:'0 0 8px',fontSize:20,fontWeight:800,color:'#fff'}}>Como dueno del negocio</p>
            <p style={{margin:'0 0 14px',fontSize:13,color:'rgba(255,255,255,0.45)',lineHeight:1.6}}>Gestiona la agenda, los clientes, el equipo y los servicios.</p>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{bf.map(f=><span key={f} style={{display:'inline-block',padding:'4px 11px',borderRadius:20,fontSize:11,fontWeight:500,background:'rgba(185,146,76,0.15)',color:T.gold,border:`1px solid ${T.goldBorder}`}}>{f}</span>)}</div>
          </div>
          <button onClick={onDemoBusiness} style={{width:'100%',background:T.gold,border:'none',padding:'14px 22px',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit',textAlign:'left'}}>PROBAR PANEL</button>
        </div>
      </div>
    </div>
  );
}
function BusinessLogin({onLogin,onDemoAccess,onBack}){
  const [email,setEmail]=React.useState('');
  const [pass,setPass]=React.useState('');
  const inp={width:'100%',padding:'13px 16px',background:'#1C1C1C',border:'1.5px solid #2A2A2A',borderRadius:T.radiusSm,fontSize:14,color:'#fff',fontFamily:'inherit',outline:'none'};
  return(
    <div style={{minHeight:'100vh',background:T.bgDark,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24}}>
      <button onClick={onBack} style={{position:'absolute',top:20,left:20,background:'none',border:'none',color:T.ink3,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Volver</button>
      <div style={{width:'100%',maxWidth:340}}>
        <h2 style={{margin:'0 0 6px',fontSize:22,fontWeight:800,color:'#fff',textAlign:'center'}}>Acceso peluqueria</h2>
        <p style={{margin:'0 0 28px',fontSize:13,color:T.ink3,textAlign:'center'}}>Panel de gestion del negocio</p>
        <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:14}}>
          <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" type="email" style={inp}/>
          <input value={pass} onChange={e=>setPass(e.target.value)} placeholder="Contrasena" type="password" style={inp}/>
        </div>
        <button style={{width:'100%',background:T.gold,border:'none',borderRadius:T.radiusSm,padding:14,color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:'inherit',marginBottom:16}}>Entrar</button>
        <button onClick={onDemoAccess} style={{width:'100%',background:'rgba(185,146,76,0.12)',border:`1.5px solid ${T.goldBorder}`,borderRadius:T.radiusSm,padding:13,color:T.gold,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Entrar en modo demo</button>
      </div>
    </div>
  );
}

function BottomNav({active,onNav}){
  const items=[
    {id:'home',    icon:'⌂',  label:'Inicio'},
    {id:'services',icon:'✂',  label:'Servicios'},
    {id:'booking', icon:'+',  label:'Reservar', cta:true},
    {id:'appointments',icon:'◫',label:'Mis citas'},
    {id:'products', icon:'◉', label:'Productos'},
    {id:'profile', icon:'◎', label:'Perfil'},
  ];
  return(
    <div style={{position:'fixed',bottom:0,left:0,right:0,background:T.bgCard,borderTop:'1px solid rgba(0,0,0,0.07)',display:'flex',zIndex:100,boxShadow:'0 -4px 20px rgba(0,0,0,0.06)'}}>
      {items.map(item=>{
        const isActive=active===item.id;
        if(item.cta) return(
          <button key={item.id} onClick={()=>onNav(item.id)} style={{flex:1,border:'none',background:'none',padding:'8px 4px 14px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:2,fontFamily:'inherit'}}>
            <div style={{width:46,height:46,borderRadius:'50%',background:T.ink,display:'flex',alignItems:'center',justifyContent:'center',marginTop:-20,boxShadow:'0 4px 16px rgba(0,0,0,0.22)'}}>
              <span style={{fontSize:22,color:'#fff',lineHeight:1,fontWeight:300}}>+</span>
            </div>
            <span style={{fontSize:10,fontWeight:600,color:T.ink3,marginTop:2}}>Reservar</span>
          </button>
        );
        return(
          <button key={item.id} onClick={()=>onNav(item.id)} style={{flex:1,border:'none',background:'none',padding:'10px 4px 14px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3,fontFamily:'inherit'}}>
            <span style={{fontSize:18,color:isActive?T.ink:T.ink3,lineHeight:1}}>{item.icon}</span>
            <span style={{fontSize:10,fontWeight:isActive?700:500,color:isActive?T.ink:T.ink3,letterSpacing:.2}}>{item.label}</span>
            {isActive&&<div style={{width:18,height:2,background:T.gold,borderRadius:2,marginTop:1}}/>}
          </button>
        );
      })}
    </div>
  );
}

function ProfileViewLoggedIn({user,onLogout}){

          <div>
            <p style={{margin:0,fontSize:18,fontWeight:800,color:'#fff'}}>{user.name}</p>
            <p style={{margin:'2px 0 0',fontSize:13,color:T.ink3}}>📞 +34 {user.phone}</p>
          </div>
        </div>
      </div>
      <div style={{padding:20}}>
        <Card style={{marginBottom:16,overflow:'hidden',padding:0}}>
          {[{icon:'◫',label:'Mis citas',sub:'Ver y gestionar reservas'},{icon:'⭐',label:'Mis bonos',sub:'Sesiones disponibles'},{icon:'✦',label:'Mi fidelización',sub:'Sellos y puntos'},{icon:'◎',label:'Mis preferencias',sub:'Profesional habitual'}].map((item,i,arr)=>(
            <div key={item.label} style={{display:'flex',alignItems:'center',gap:14,padding:'14px 18px',borderBottom:i<arr.length-1?'1px solid rgba(0,0,0,0.05)':'none',cursor:'pointer'}}
              onMouseEnter={e=>e.currentTarget.style.background='#FAFAF8'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}
            >
              <span style={{fontSize:18,color:T.gold,width:26}}>{item.icon}</span>
              <div style={{flex:1}}><p style={{margin:0,fontSize:14,fontWeight:600,color:T.ink}}>{item.label}</p><p style={{margin:0,fontSize:12,color:T.ink3}}>{item.sub}</p></div>
              <span style={{color:T.ink3,fontSize:14}}>›</span>
            </div>
          ))}
        </Card>
        <Card style={{marginBottom:16}}>
          <Section label="Victor Monió Barbería"/>
          {[['Dirección','Calle Sta. Ana 11, Cartama'],['Teléfono','963 000 000'],['L–V','09:00–20:00'],['Sábado','09:00–15:00'],['Dom. Lun.','Cerrado']].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid rgba(0,0,0,0.05)'}}><span style={{fontSize:13,color:T.ink2}}>{l}</span><span style={{fontSize:13,fontWeight:600}}>{v}</span></div>
          ))}
        </Card>
        <button onClick={onLogout} style={{width:'100%',background:'none',border:'1px solid rgba(0,0,0,0.1)',borderRadius:T.radiusSm,padding:13,color:T.ink2,fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Cerrar sesión</button>
      </div>
    </div>
  );
}

  const totalDuration=useMemo(()=>!selectedService?0:selectedService.duration+selectedExtras.reduce((s,eid)=>s+(extrasData[eid]?.duration||0),0),[selectedService,selectedExtras]);
  const totalPrice=useMemo(()=>!selectedService?0:selectedService.price+selectedExtras.reduce((s,eid)=>s+(extrasData[eid]?.price||0),0),[selectedService,selectedExtras]);

  const availableSlots=useMemo(()=>{
    if(!selectedDate||!selectedProfessional||selectedProfessional.id==="any") return [];
    return getAvailableSlots(selectedDate,selectedProfessional.id,totalDuration,appointments);
  },[selectedDate,selectedProfessional,totalDuration,appointments]);

  const compatibleProfs=useMemo(()=>!selectedService?professionals:professionals.filter(p=>p.serviceIds.includes(selectedService.id)),[selectedService]);

  const availableDates=useMemo(()=>{
    const dates=[];
    for(let i=0;i<14;i++){
      const d=new Date(todayNow.getTime()+i*86400000);
      const dStr=d.toISOString().split("T")[0];
      if(businessConfig.schedule[d.getDay()]) dates.push(dStr);
    }
    return dates;
  },[]);

  function toggleExtra(eid){setSelectedExtras(p=>p.includes(eid)?p.filter(e=>e!==eid):[...p,eid]);}

  function handleConfirm(){
    if(!clientName.trim()||!clientPhone.trim()||!privacyOk){setError("Completa nombre, teléfono y acepta la política de privacidad.");return;}
    setError("");
    const profId=selectedProfessional.id==="any"
      ?compatibleProfs.find(p=>getAvailableSlots(selectedDate,p.id,totalDuration,appointments).includes(selectedTime))?.id
      :selectedProfessional.id;
    if(!profId){setError("No se encontró disponibilidad. Por favor elige otra hora.");return;}
    const current=getAvailableSlots(selectedDate,profId,totalDuration,appointments);
    if(!current.includes(selectedTime)){setError("Este horario acaba de ser reservado. Elige otro.");setStep(3);return;}
    const newApt={id:"apt"+Date.now(),date:selectedDate,time:selectedTime,professionalId:profId,serviceId:selectedService.id,clientName,clientPhone,clientEmail,notes,status:"confirmed",duration:totalDuration,price:totalPrice,code:generateBookingCode()};
    onAppointmentCreated(newApt);
    setConfirmResult(newApt);
    setStep(6);
  }

  function reset(){setStep(0);setSelectedService(null);setSelectedExtras([]);setSelectedProfessional(null);setSelectedDate(null);setSelectedTime(null);setClientName("");setClientPhone("");setClientEmail("");setNotes("");setPrivacyOk(false);setConfirmResult(null);setError("");}

  const SI=({current,total})=>(
    <div style={{display:"flex",gap:5,padding:"0 20px 16px"}}>
      {Array.from({length:total}).map((_,i)=>(
        <div key={i} style={{flex:1,height:3,borderRadius:2,background:i<current?"#1a1a1a":i===current?"#B89A5A":"#F0EDE8",transition:"background 0.3s"}}/>
      ))}
    </div>
  );

  if(step===6&&confirmResult){
    const prof=professionals.find(p=>p.id===confirmResult.professionalId);
    const svc=services.find(s=>s.id===confirmResult.serviceId);
    return(
      <div style={{padding:20,paddingBottom:80,textAlign:"center"}}>
        <div style={{background:"#111",borderRadius:20,padding:"40px 20px",marginBottom:20,color:"#fff"}}>
          <div style={{width:60,height:60,borderRadius:"50%",background:"rgba(184,154,90,0.15)",border:"2px solid #B89A5A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 16px",color:"#B89A5A"}}>✓</div>
          <h2 style={{margin:"0 0 8px",fontSize:24,fontWeight:800}}>¡Cita reservada!</h2>
          <p style={{margin:"0 0 20px",color:"#666",fontSize:14}}>Te esperamos en Victor Monió Barbería</p>
          <div style={{background:"rgba(184,154,90,0.1)",border:"1px solid rgba(184,154,90,0.3)",borderRadius:12,padding:"14px 20px",marginBottom:16}}>
            <p style={{margin:0,fontSize:12,color:"#B89A5A"}}>Código de reserva</p>
            <p style={{margin:"4px 0 0",fontSize:22,fontWeight:800,letterSpacing:3,color:"#B89A5A"}}>{confirmResult.code}</p>
          </div>
          <div style={{textAlign:"left"}}>
            {[["Servicio",svc?.name],["Profesional",prof?.name],["Fecha",formatDateShort(confirmResult.date)],["Hora",confirmResult.time],["Duración",`${confirmResult.duration} min`],["Precio",`${confirmResult.price} €`]].map(([l,v])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
                <span style={{fontSize:13,color:"#666"}}>{l}</span>
                <span style={{fontSize:13,fontWeight:700}}>{v}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Btn variant="primary" style={{width:"100%"}} onClick={()=>{}}>Añadir al calendario</Btn>
          <Btn variant="outline" style={{width:"100%"}} onClick={()=>{}}>Cómo llegar</Btn>
          <Btn variant="ghost" style={{width:"100%"}} onClick={reset}>Nueva reserva</Btn>
        </div>
        <p style={{fontSize:11,color:"#aaa",marginTop:16,lineHeight:1.7}}>Cancelación gratuita hasta 24h antes de la cita.</p>
      </div>
    );
  }

  return(
    <div style={{paddingBottom:80}}>
      <SectionHero/>
      <div style={{padding:"24px 20px 12px"}}>
        <h2 style={{margin:0,fontSize:20,fontWeight:800}}>Reservar cita</h2>
      </div>
      <SI current={step} total={6}/>

      {/* PASO 0 */}
      {step===0&&(
        <div style={{padding:"0 20px"}}>
          <p style={{fontSize:13,color:"#888",marginBottom:16}}>¿Qué servicio necesitas?</p>
          <div style={{position:"relative",marginBottom:16}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar..." style={{width:"100%",padding:"11px 16px 11px 40px",border:"1.5px solid #E8E8E8",borderRadius:12,fontSize:14,fontFamily:"inherit",background:"#F8F7F5",outline:"none",boxSizing:"border-box"}}/>
            <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"#aaa"}}>🔍</span>
          </div>
          {categories.map(cat=>{
            const cs=services.filter(s=>s.cat===cat.id&&(!search||s.name.toLowerCase().includes(search.toLowerCase())));
            if(!cs.length) return null;
            return(
              <div key={cat.id} style={{marginBottom:20}}>
                <p style={{margin:"0 0 8px",fontSize:11,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:1}}>{cat.name}</p>
                {cs.map(s=>(
                  <div key={s.id} onClick={()=>{setSelectedService(s);setStep(1);}} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",background:"#fff",borderRadius:12,marginBottom:8,cursor:"pointer",border:"1.5px solid #F0EDE8"}}>
                    <div>
                      <p style={{margin:0,fontSize:14,fontWeight:700}}>{s.name}</p>
                      <p style={{margin:"2px 0 0",fontSize:12,color:"#888"}}>{s.duration} min</p>
                    </div>
                    <span style={{fontSize:15,fontWeight:800}}>{s.priceFrom&&<span style={{fontSize:11,color:"#888",fontWeight:400}}>desde </span>}{s.price} €</span>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {/* PASO 1 */}
      {step===1&&selectedService&&(
        <div style={{padding:"0 20px"}}>
          <Card style={{marginBottom:16}}>
            <p style={{margin:"0 0 4px",fontSize:16,fontWeight:800}}>{selectedService.name}</p>
            <p style={{margin:"0 0 8px",fontSize:13,color:"#888"}}>{selectedService.desc}</p>
            <div style={{display:"flex",gap:10}}>
              <Badge>⏱ {selectedService.duration} min</Badge>
              <Badge color="#B89A5A" bg="#FBF5EE">{selectedService.price} €</Badge>
            </div>
          </Card>
          {selectedService.extras.length>0&&(
            <div style={{marginBottom:16}}>
              <p style={{margin:"0 0 10px",fontSize:13,fontWeight:700}}>Extras opcionales</p>
              {selectedService.extras.map(eid=>{
                const ex=extrasData[eid];if(!ex) return null;
                const sel=selectedExtras.includes(eid);
                return(
                  <div key={eid} onClick={()=>toggleExtra(eid)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",background:sel?"#1a1a1a":"#fff",borderRadius:12,marginBottom:8,cursor:"pointer",border:`1.5px solid ${sel?"#1a1a1a":"#F0EDE8"}`,color:sel?"#fff":"#1a1a1a"}}>
                    <div><p style={{margin:0,fontSize:14,fontWeight:700}}>{ex.name}</p><p style={{margin:0,fontSize:12,color:sel?"#888":"#888"}}>+{ex.duration} min</p></div>
                    <span style={{fontWeight:800}}>+{ex.price} €</span>
                  </div>
                );
              })}
            </div>
          )}
          <div style={{background:"#F8F7F5",borderRadius:12,padding:14,marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:13,color:"#888"}}>Duración</span><span style={{fontWeight:700}}>{totalDuration} min</span></div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}><span style={{fontSize:13,color:"#888"}}>Total</span><span style={{fontWeight:800,fontSize:18,color:"#B89A5A"}}>{totalPrice} €</span></div>
          </div>
          <Btn onClick={()=>setStep(2)} style={{width:"100%"}}>Continuar →</Btn>
          <button onClick={()=>setStep(0)} style={{display:"block",margin:"12px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Cambiar servicio</button>
        </div>
      )}

      {/* PASO 2 */}
      {step===2&&(
        <div style={{padding:"0 20px"}}>
          <p style={{fontSize:13,color:"#888",marginBottom:16}}>¿Con quién quieres la cita?</p>
          <div onClick={()=>{setSelectedProfessional({id:"any",name:"Cualquier profesional"});setStep(3);}} style={{display:"flex",alignItems:"center",gap:14,padding:16,background:"#fff",borderRadius:14,marginBottom:10,cursor:"pointer",border:"1.5px solid #F0EDE8"}}>
            <div style={{width:48,height:48,borderRadius:"50%",background:"#F0EDE8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>✦</div>
            <div><p style={{margin:0,fontSize:15,fontWeight:700}}>Cualquier profesional</p><p style={{margin:0,fontSize:12,color:"#888"}}>El primero disponible</p></div>
          </div>
          {compatibleProfs.map(p=>(
            <div key={p.id} onClick={()=>{setSelectedProfessional(p);setStep(3);}} style={{display:"flex",alignItems:"center",gap:14,padding:16,background:"#fff",borderRadius:14,marginBottom:10,cursor:"pointer",border:`1.5px solid ${selectedProfessional?.id===p.id?"#1a1a1a":"#F0EDE8"}`}}>
              <Avatar initials={p.avatar} size={48}/>
              <div style={{flex:1}}>
                <p style={{margin:0,fontSize:15,fontWeight:800}}>{p.name}</p>
                <p style={{margin:"2px 0 4px",fontSize:12,color:"#888"}}>{p.role}</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{p.specialties.slice(0,2).map(s=><Badge key={s}>{s}</Badge>)}</div>
              </div>
              <div style={{textAlign:"right"}}><Stars rating={p.rating} size={12}/><p style={{margin:"2px 0 0",fontSize:12,color:"#B89A5A",fontWeight:800}}>{p.rating}</p></div>
            </div>
          ))}
          <button onClick={()=>setStep(1)} style={{display:"block",margin:"12px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Atrás</button>
        </div>
      )}

      {/* PASO 3 */}
      {step===3&&(
        <div style={{padding:"0 20px"}}>
          <p style={{fontSize:13,color:"#888",marginBottom:16}}>¿Cuándo quieres la cita?</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {availableDates.map(d=>{
              const hasSlots=selectedProfessional?.id==="any"
                ?professionals.some(p=>getAvailableSlots(d,p.id,totalDuration,appointments).length>0)
                :getAvailableSlots(d,selectedProfessional.id,totalDuration,appointments).length>0;
              return(
                <button key={d} onClick={()=>{if(hasSlots){setSelectedDate(d);setSelectedTime(null);setStep(4);}}} disabled={!hasSlots} style={{padding:"14px 10px",background:selectedDate===d?"#1a1a1a":hasSlots?"#fff":"#F8F7F5",border:`1.5px solid ${selectedDate===d?"#1a1a1a":hasSlots?"#F0EDE8":"#F0EDE8"}`,borderRadius:12,cursor:hasSlots?"pointer":"default",color:selectedDate===d?"#fff":hasSlots?"#1a1a1a":"#ccc",fontFamily:"inherit",fontSize:13,fontWeight:700}}>
                  <div>{formatDateLabel(d)}</div>
                  {!hasSlots&&<div style={{fontSize:10,marginTop:3,opacity:0.7}}>Sin disponibilidad</div>}
                </button>
              );
            })}
          </div>
          <button onClick={()=>setStep(2)} style={{display:"block",margin:"16px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Atrás</button>
        </div>
      )}

      {/* PASO 4 */}
      {step===4&&(
        <div style={{padding:"0 20px"}}>
          <p style={{fontSize:13,color:"#888",marginBottom:4}}>Horas disponibles</p>
          <p style={{fontSize:15,fontWeight:800,marginBottom:16}}>{formatDateLabel(selectedDate)}</p>
          {availableSlots.length===0?(
            <div style={{textAlign:"center",padding:40}}>
              <p style={{fontSize:14,color:"#888"}}>No hay huecos disponibles este día.</p>
              <Btn variant="outline" onClick={()=>setStep(3)} style={{marginTop:12}}>Cambiar fecha</Btn>
            </div>
          ):(
            <>
              {(()=>{
                const am=availableSlots.filter(t=>parseInt(t)<14);
                const pm=availableSlots.filter(t=>parseInt(t)>=14);
                return(
                  <>
                    {am.length>0&&<p style={{fontSize:11,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Mañana</p>}
                    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
                      {am.map(t=><button key={t} onClick={()=>{setSelectedTime(t);setStep(5);}} style={{padding:"12px 6px",border:`1.5px solid ${selectedTime===t?"#1a1a1a":"#F0EDE8"}`,borderRadius:10,background:selectedTime===t?"#1a1a1a":"#fff",color:selectedTime===t?"#fff":"#1a1a1a",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>{t}</button>)}
                    </div>
                    {pm.length>0&&<p style={{fontSize:11,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Tarde</p>}
                    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                      {pm.map(t=><button key={t} onClick={()=>{setSelectedTime(t);setStep(5);}} style={{padding:"12px 6px",border:`1.5px solid ${selectedTime===t?"#1a1a1a":"#F0EDE8"}`,borderRadius:10,background:selectedTime===t?"#1a1a1a":"#fff",color:selectedTime===t?"#fff":"#1a1a1a",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>{t}</button>)}
                    </div>
                  </>
                );
              })()}
            </>
          )}
          <button onClick={()=>setStep(3)} style={{display:"block",margin:"16px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Cambiar fecha</button>
        </div>
      )}

      {/* PASO 5 */}
      {step===5&&(
        <div style={{padding:"0 20px"}}>
          <Card style={{marginBottom:16}}>
            <p style={{margin:"0 0 10px",fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1}}>Resumen</p>
            {[["Servicio",`${selectedService.name}${selectedExtras.length>0?" + extras":""}`],["Profesional",selectedProfessional?.id==="any"?"Cualquier profesional":selectedProfessional?.name],["Fecha",formatDateShort(selectedDate)],["Hora",selectedTime],["Duración",`${totalDuration} min`]].map(([l,v])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #F8F7F5"}}>
                <span style={{fontSize:13,color:"#888"}}>{l}</span>
                <span style={{fontSize:13,fontWeight:700}}>{v}</span>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0 0"}}>
              <span style={{fontSize:15,fontWeight:800}}>Total</span>
              <span style={{fontSize:18,fontWeight:800,color:"#B89A5A"}}>{totalPrice} €</span>
            </div>
          </Card>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {[["Tu nombre *",clientName,setClientName,"text"],["Teléfono *",clientPhone,setClientPhone,"tel"],["Email (opcional)",clientEmail,setClientEmail,"email"]].map(([ph,val,setter,type])=>(
              <input key={ph} value={val} onChange={e=>setter(e.target.value)} placeholder={ph} type={type} style={{padding:"13px 16px",border:"1.5px solid #E8E8E8",borderRadius:12,fontSize:14,fontFamily:"inherit",outline:"none"}}/>
            ))}
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Notas para el profesional (opcional)" rows={3} style={{padding:"13px 16px",border:"1.5px solid #E8E8E8",borderRadius:12,fontSize:14,fontFamily:"inherit",outline:"none",resize:"vertical"}}/>
            <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer"}}>
              <input type="checkbox" checked={privacyOk} onChange={e=>setPrivacyOk(e.target.checked)} style={{marginTop:2}}/>
              <span style={{fontSize:13,color:"#666",lineHeight:1.5}}>Acepto la política de privacidad y recibir comunicaciones sobre mi cita.</span>
            </label>
          </div>
          {error&&<div style={{background:"#FFF0EE",borderRadius:10,padding:"12px 16px",marginTop:12,fontSize:13,color:"#C0392B"}}>{error}</div>}
          <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:10}}>
            <Btn onClick={handleConfirm} style={{width:"100%"}}>CONFIRMAR RESERVA</Btn>
            <p style={{textAlign:"center",fontSize:12,color:"#aaa",margin:0}}>Cancelación gratuita hasta 24h antes</p>
          </div>
          <button onClick={()=>setStep(4)} style={{display:"block",margin:"12px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Cambiar hora</button>
        </div>
      )}
    </div>
  );
}


// APTS

function AppointmentsView({appointments}){
  const [tab,setTab]=useState("upcoming");
  const upcoming=appointments.filter(a=>(a.date>todayStr||(a.date===todayStr&&a.status==="confirmed"))&&a.status!=="cancelled");
  const past=appointments.filter(a=>(a.date<todayStr||a.status==="completed")&&a.status!=="cancelled");
  const cancelled=appointments.filter(a=>a.status==="cancelled");
  const tabs=[{id:"upcoming",label:"Próximas",list:upcoming},{id:"past",label:"Anteriores",list:past},{id:"cancelled",label:"Canceladas",list:cancelled}];
  function AptCard({apt}){
    const prof=professionals.find(p=>p.id===apt.professionalId);
    const svc=services.find(s=>s.id===apt.serviceId);
    const sc={confirmed:{bg:"#EFF8F0",c:"#2E7D32"},completed:{bg:"#F0EDE8",c:"#888"},cancelled:{bg:"#FFF0EE",c:"#C0392B"}}[apt.status]||{bg:"#F0EDE8",c:"#888"};
    return(
      <Card style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div><p style={{margin:0,fontSize:15,fontWeight:800}}>{svc?.name||apt.serviceId}</p><p style={{margin:"2px 0 0",fontSize:12,color:"#888"}}>con {prof?.name}</p></div>
          <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,background:sc.bg,color:sc.c}}>{{confirmed:"Confirmada",completed:"Completada",cancelled:"Cancelada"}[apt.status]}</span>
        </div>
        <Divider/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[["Fecha",formatDateLabel(apt.date)],["Hora",apt.time],["Duración",`${apt.duration} min`],["Precio",`${apt.price} €`]].map(([l,v])=>(
            <div key={l}><p style={{margin:0,fontSize:11,color:"#aaa"}}>{l}</p><p style={{margin:"2px 0 0",fontSize:13,fontWeight:700}}>{v}</p></div>
          ))}
        </div>
        {apt.code&&<div style={{marginTop:10,background:"#111",borderRadius:8,padding:"8px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:11,color:"#666"}}>Código</span><span style={{fontSize:13,fontWeight:800,letterSpacing:2,color:"#B89A5A"}}>{apt.code}</span></div>}
        {apt.status==="confirmed"&&<div style={{display:"flex",gap:8,marginTop:12}}><button style={{flex:1,background:"#F8F7F5",border:"1.5px solid #F0EDE8",borderRadius:10,padding:10,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Modificar</button><button style={{flex:1,background:"#FFF0EE",border:"1.5px solid #FCCABA",borderRadius:10,padding:10,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:"#C0392B"}}>Cancelar</button></div>}
        {apt.status==="completed"&&<button style={{width:"100%",marginTop:10,background:"#1a1a1a",color:"#fff",border:"none",borderRadius:10,padding:10,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Repetir reserva</button>}
      </Card>
    );
  }
  return(
    <div style={{paddingBottom:80}}>
      <SectionHero/>
      <div style={{padding:"24px 20px 0",background:"#fff",borderBottom:"1px solid #F0EDE8"}}>
        <h2 style={{margin:"0 0 16px",fontSize:20,fontWeight:800}}>Mis citas</h2>
        <div style={{display:"flex"}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0",border:"none",background:"none",fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",color:tab===t.id?"#1a1a1a":"#aaa",borderBottom:`2px solid ${tab===t.id?"#1a1a1a":"transparent"}`,transition:"all 0.2s"}}>
              {t.label}
              {t.list.length>0&&<span style={{marginLeft:4,fontSize:11,background:tab===t.id?"#1a1a1a":"#F0EDE8",color:tab===t.id?"#fff":"#888",borderRadius:20,padding:"1px 7px"}}>{t.list.length}</span>}
            </button>
          ))}
        </div>
      </div>
      <div style={{padding:20}}>
        {tabs.find(t=>t.id===tab)?.list.length===0?(
          <div style={{textAlign:"center",padding:40,color:"#aaa"}}><div style={{fontSize:40,marginBottom:12}}>📅</div><p style={{fontSize:14}}>No hay citas en esta sección</p></div>
        ):(
          tabs.find(t=>t.id===tab)?.list.map(a=><AptCard key={a.id} apt={a}/>)
        )}
      </div>
    </div>
  );
}


// BIZ

function AdminView({appointments,onAddAppointment}){
  const [sec,setSec]=useState("dashboard");
  const todayCitas=appointments.filter(a=>a.date===todayStr&&a.status!=="cancelled");

  function navigate_(dir){const i=secIds_.indexOf(sec);const n=secIds_[i+dir];if(n)setSec(n);}
  const swipeHandlers_=useSwipe(()=>navigate_(1),()=>navigate_(-1));
  const sections=[{id:"dashboard",icon:"◈",label:"Inicio"},{id:"agenda",icon:"◫",label:"Agenda"},{id:"appointments",icon:"✓",label:"Reservas"},{id:"clients",icon:"◎",label:"Clientes"},{id:"professionals",icon:"◐",label:"Equipo"},{id:"products",icon:"◉",label:"Productos"},{id:"stats",icon:"◈",label:"Estadísticas"},{id:"settings",icon:"⊙",label:"Configuración"}];

      <div style={{backgroundImage:`url("${HERO_IMG}")`,backgroundSize:"cover",backgroundPosition:"center 35%",position:"relative",height:120,flexShrink:0}}><div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,rgba(0,0,0,0.2),rgba(0,0,0,0.6))"}}/>      </div>

        {sections.map(s=>(

            {s.icon} {s.label}
          </button>
        ))}
      </div>
      <div style={{flex:1,background:T.bg,minHeight:"60vh"}} {...swipeHandlers_}>
        {sec==="dashboard"&&<AdminDash appointments={appointments} todayCitas={todayCitas} ingresos={ingresos}/>}
        {sec==="agenda"&&<AdminAgenda appointments={appointments}/>}
        {sec==="appointments"&&<AdminApts appointments={appointments}/>}
        {sec==="clients"&&<AdminClients/>}
        {sec==="professionals"&&<AdminProfs/>}
        {sec==="stats"&&<AdminStats appointments={appointments}/>}
        {sec==="settings"&&<AdminSettings/>}
      </div>
    </div>
  );
}

function AdminStats({appointments}){
  const totalRevenue=appointments.filter(a=>a.status!=="cancelled").reduce((s,a)=>s+a.price,0);
  const byService={};
  appointments.forEach(a=>{const svc=services.find(s=>s.id===a.serviceId);const n=svc?.name||a.serviceId;byService[n]=(byService[n]||0)+1;});
  const topServices=Object.entries(byService).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const byProf={};
  appointments.filter(a=>a.status!=="cancelled").forEach(a=>{const p=professionals.find(pr=>pr.id===a.professionalId);byProf[p?.name||a.professionalId]=(byProf[p?.name||a.professionalId]||0)+1;});
  return(
    <div style={{padding:20}}>
      <h3 style={{margin:"0 0 16px",fontSize:16,fontWeight:800}}>Estadísticas</h3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
        {[{l:"Facturación",v:`${totalRevenue} €`,c:"#B89A5A"},{l:"Citas",v:appointments.filter(a=>a.status!=="cancelled").length,c:"#4CAF50"},{l:"Ticket medio",v:`${Math.round(totalRevenue/Math.max(1,appointments.filter(a=>a.status!=="cancelled").length))} €`,c:"#1a1a1a"},{l:"Tasa cancel.",v:"0%",c:"#E74C3C"}].map(s=>(
          <Card key={s.l} style={{textAlign:"center"}}><p style={{margin:"0 0 4px",fontSize:10,color:"#aaa",textTransform:"uppercase",letterSpacing:1}}>{s.l}</p><p style={{margin:0,fontSize:22,fontWeight:800,color:s.c}}>{s.v}</p></Card>
        ))}
      </div>
      <Card style={{marginBottom:16}}>
        <p style={{margin:"0 0 12px",fontSize:13,fontWeight:800}}>Servicios más solicitados</p>
        {topServices.map(([name,count])=>(
          <div key={name}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:13,color:"#444"}}>{name}</span><span style={{fontSize:13,fontWeight:700}}>{count}</span></div>
            <div style={{height:5,background:"#F0EDE8",borderRadius:3,marginBottom:10}}><div style={{height:"100%",width:`${(count/(topServices[0][1]||1))*100}%`,background:"#B89A5A",borderRadius:3}}/></div>
          </div>
        ))}
      </Card>
      <Card>
        <p style={{margin:"0 0 12px",fontSize:13,fontWeight:800}}>Por profesional</p>
        {Object.entries(byProf).sort((a,b)=>b[1]-a[1]).map(([name,count])=>{
          const p=professionals.find(pr=>pr.name===name);
          return(
            <div key={name} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
              <Avatar initials={p?.avatar||name[0]} size={36}/>
              <div style={{flex:1}}><p style={{margin:0,fontSize:13,fontWeight:700}}>{name}</p><div style={{height:4,background:"#F0EDE8",borderRadius:2,marginTop:4}}><div style={{height:"100%",width:`${(count/appointments.length)*100}%`,background:"#1a1a1a",borderRadius:2}}/></div></div>
              <span style={{fontSize:13,fontWeight:800}}>{count}</span>
            </div>
          );
        })}
      </Card>
    </div>
  );
}

// ============================================================


// CLIENT

function ClientApp({ appointments, onAppointmentCreated, demoMode=false, onExitDemo }){
  const [clientNav,setClientNav]=useState("home");
  const [bookingService,setBookingService]=useState(null);
  const [user,setUser]=useState(null);
  const [loginContext,setLoginContext]=useState("appointments");
  const [showLogin,setShowLogin]=useState(false);
  const [swipeHint,setSwipeHint]=useState(true);
  useEffect(()=>{const t=setTimeout(()=>setSwipeHint(false),3500);return()=>clearTimeout(t);},[]);
  const [slideDir,setSlideDir]=useState(null);
  const [animKey,setAnimKey]=useState(0);

  const TAB_ORDER=["home","services","booking","appointments","products","profile"];

  function handleNavWithReset(view,dir=null){
    window.scrollTo({top:0,behavior:"instant"});
    if(view!=="booking") setBookingService(null);
    if(!demoMode&&(view==="appointments"||view==="profile")&&!user){
      setLoginContext(view); setShowLogin(true); return;
    }
    setShowLogin(false);
    if(dir){setSlideDir(dir);setAnimKey(k=>k+1);}
    setClientNav(view);
  }
  function handleSwipeLeft(){
    if(showLogin) return;
    const cur=TAB_ORDER.indexOf(clientNav);
    if(cur<TAB_ORDER.length-1) handleNavWithReset(TAB_ORDER[cur+1],"left");
  }
  function handleSwipeRight(){
    if(showLogin) return;
    const cur=TAB_ORDER.indexOf(clientNav);
    if(cur>0) handleNavWithReset(TAB_ORDER[cur-1],"right");
  }
  const swipeHandlers=useSwipe(handleSwipeLeft,handleSwipeRight);

  const slideStyle=slideDir?{animation:`slideIn${slideDir==="left"?"Left":"Right"} 0.28s cubic-bezier(0.25,0.46,0.45,0.94) both`}:{};
  

  return(
    <div style={{fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",background:"#F8F7F5",minHeight:"100vh",overflow:"hidden"}}>
      <style>{`
        @keyframes slideInLeft{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes slideInRight{from{transform:translateX(-40px);opacity:0}to{transform:translateX(0);opacity:1}}
      `}</style>

      

      {showLogin?(
        <div style={{paddingTop:0}}>
          <LoginView context={loginContext} onLogin={u=>{setUser(u);setShowLogin(false);setClientNav(loginContext);}} onBack={()=>{setShowLogin(false);setClientNav("home");}}/>
        </div>
      ):(
        <div key={animKey} style={{...slideStyle,minHeight:"100vh",paddingTop:0}} {...swipeHandlers}>
          {clientNav==="home"&&<HomeView onNav={handleNavWithReset} appointments={appointments} onReservar={()=>setClientNav("booking")}/>}
          {clientNav==="services"&&<ServicesView onBookService={s=>{setBookingService(s);setClientNav("booking");}}/>}
          {clientNav==="booking"&&<BookingView key={bookingService?.id||"booking"} appointments={appointments} onAppointmentCreated={onAppointmentCreated} initialService={bookingService}/>}
          {clientNav==="appointments"&&<AppointmentsView appointments={appointments}/>}
          {clientNav==="products"&&<ProductsView/>}
          {clientNav==="profile"&&(user?<ProfileViewLoggedIn user={user} onLogout={()=>{if(!demoMode){setUser(null);setClientNav("home");}}}/>:<ProfileView/>)}
        </div>
      )}
      {swipeHint&&(<div className="swipe-hint-pill" style={{position:'fixed',bottom:200,left:'50%',transform:'translateX(-50%)',zIndex:800,background:'rgba(17,17,17,0.88)',borderRadius:24,padding:'9px 20px',display:'flex',alignItems:'center',gap:8,boxShadow:'0 4px 16px rgba(0,0,0,0.25)',pointerEvents:'none',whiteSpace:'nowrap'}}>
        <span style={{fontSize:16}}>👈</span>
        <span style={{fontSize:12,fontWeight:600,color:'#fff',letterSpacing:.3}}>Desliza para cambiar de sección</span>
        <span style={{fontSize:16}}>👉</span>
      </div>)}
      <StyleBot onReservar={()=>handleNavWithReset('booking')}/>
      <BottomNav active={showLogin?loginContext:clientNav} onNav={v=>handleNavWithReset(v)}/>
    </div>
  );
}

// BUSINESS APP — wrapper reutilizable (demo + producción)

// BIZAPP

function BusinessApp({ appointments, onAppointmentCreated, demoMode=false, onExitDemo, onReset }){
  
  return(
    <div style={{fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",maxWidth:"480px",margin:"0 auto",minHeight:"100vh",display:"flex",flexDirection:"column",background:"#F8F7F5"}}>
      
      <div style={{flex:1}}>
        <AdminView appointments={appointments} onAddAppointment={onAppointmentCreated}/>
      </div>
    </div>
  );
}

// APP PRINCIPAL
// ============================================================



function HamburgerMenu({onClient,onDemo,onBusiness}){
  const [open,setOpen]=useState(false);
  return(
    <div style={{position:'fixed',top:0,right:0,zIndex:600}}>
      {open&&<div onClick={()=>setOpen(false)} style={{position:'fixed',inset:0,zIndex:590}}/>}
      <button onClick={()=>setOpen(!open)} aria-label="Menu"
        style={{position:'relative',zIndex:601,background:'rgba(255,255,255,0.92)',backdropFilter:'blur(8px)',border:'none',borderLeft:'1px solid rgba(0,0,0,0.07)',borderBottom:'1px solid rgba(0,0,0,0.07)',borderBottomLeftRadius:10,padding:'12px 14px',cursor:'pointer',display:'flex',flexDirection:'column',gap:5,alignItems:'center',boxShadow:'0 2px 12px rgba(0,0,0,0.1)'}}>
        <span style={{display:'block',width:20,height:2,background:T.ink,transition:'all .2s',transform:open?'rotate(45deg) translate(4px,5px)':'none'}}/>
        <span style={{display:'block',width:20,height:2,background:T.ink,opacity:open?0:1,transition:'opacity .15s'}}/>
        <span style={{display:'block',width:20,height:2,background:T.ink,transition:'all .2s',transform:open?'rotate(-45deg) translate(4px,-5px)':'none'}}/>
      </button>
      {open&&(
        <div style={{position:'absolute',top:'100%',right:0,background:T.bgCard,border:'1px solid rgba(0,0,0,0.07)',borderRadius:'0 0 0 14px',overflow:'hidden',minWidth:220,boxShadow:T.shadowMd,zIndex:602}}>
          {[
            {label:'Vista Cliente',desc:'App de reservas',icon:'O',action:()=>{onClient();setOpen(false);}},
            {label:'Panel Peluqueria',desc:'Gestion del negocio',icon:'[]',action:()=>{onBusiness();setOpen(false);}},
          ].map((item,i,arr)=>(
            <button key={item.label} onClick={item.action}
              style={{display:'block',width:'100%',background:'none',border:'none',borderBottom:i<arr.length-1?'1px solid rgba(0,0,0,0.05)':'none',padding:'13px 18px',textAlign:'left',cursor:'pointer',fontFamily:'inherit'}}
              onMouseEnter={e=>e.currentTarget.style.background=T.bg}
              onMouseLeave={e=>e.currentTarget.style.background='none'}
            >
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <span style={{fontSize:12,color:T.gold,width:22,flexShrink:0}}>{item.icon}</span>
                <div>
                  <p style={{margin:0,fontSize:13,fontWeight:700,color:T.ink}}>{item.label}</p>
                  <p style={{margin:'1px 0 0',fontSize:11,color:T.ink3}}>{item.desc}</p>
                </div>
              </div>
            </button>
          ))}
          <div style={{padding:'8px 18px 10px',borderTop:'1px solid rgba(0,0,0,0.05)',background:T.bg}}>
            <p style={{margin:0,fontSize:10,color:T.ink3,letterSpacing:1.2,textTransform:'uppercase'}}>Demo Limonada Web</p>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [mode,setMode]=useState('demoClient');
  const [appointments,setAppointments]=useState(initialAppointments);
  function handleAppointmentCreated(apt){setAppointments(p=>[...p,apt]);}
  function handleResetDemo(){setAppointments(initialAppointments);}
  const menu=<HamburgerMenu onClient={()=>setMode('demoClient')} onDemo={()=>setMode('demo')} onBusiness={()=>setMode('demoBusiness')}/>;
  return(
    <div style={{fontFamily:F,background:'#E8E4DD',minHeight:'100vh'}}>
      {menu}
      <div style={{maxWidth:'480px',margin:'0 auto',background:T.bg,minHeight:'100vh',position:'relative',boxShadow:'0 0 60px rgba(0,0,0,0.07)'}}>
        {mode==='demo'&&<DemoPortal onDemoClient={()=>setMode('demoClient')} onDemoBusiness={()=>setMode('demoBusiness')} onBack={()=>setMode('demoClient')}/>}
        {mode==='demoClient'&&<ClientApp appointments={appointments} onAppointmentCreated={handleAppointmentCreated} demoMode={true} onExitDemo={()=>setMode('demo')}/>}
        {mode==='demoBusiness'&&<BusinessApp appointments={appointments} onAppointmentCreated={handleAppointmentCreated} demoMode={true} onExitDemo={()=>setMode('demo')} onReset={handleResetDemo}/>}
        {mode==='businessLogin'&&<BusinessLogin onLogin={()=>setMode('demoBusiness')} onDemoAccess={()=>setMode('demoBusiness')} onBack={()=>setMode('demoClient')}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode,null,React.createElement(App))
);

  </script>
</body>
