// ══ booking ══

function timeToMinutes(t) { const [h,m] = t.split(":").map(Number); return h*60+m; }
function minutesToTime(m) { return `${Math.floor(m/60).toString().padStart(2,"0")}:${(m%60).toString().padStart(2,"0")}`; }
function getDayOfWeek(dateStr) { return new Date(dateStr+"T12:00:00").getDay(); }
const todayNow = new Date();
function isToday(d) { return d===todayStr; }
function isTomorrow(d) { return d===tomorrowStr; }
function formatDateLabel(d) {
  if(isToday(d)) return "Hoy";
  if(isTomorrow(d)) return "Mañana";
  return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
}
function formatDateShort(d) { return new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"long"}); }
function generateBookingCode() { return "VM-"+Math.random().toString(36).substring(2,7).toUpperCase(); }

function getAvailableSlots(date, professionalId, serviceDuration, appointments) {
  const dow = getDayOfWeek(date);
  const prof = professionals.find(p=>p.id===professionalId);
  if(!prof) return [];
  const sched = prof.schedule[dow];
  if(!sched) return [];
  const ranges = Array.isArray(sched)?sched:[sched];
  const busy = appointments
    .filter(a=>a.date===date&&a.professionalId===professionalId&&a.status!=="cancelled")
    .map(a=>({start:timeToMinutes(a.time),end:timeToMinutes(a.time)+a.duration}));
  const slots=[];
  for(const r of ranges){
    let cur=timeToMinutes(r.open);
    const end=timeToMinutes(r.close);
    while(cur+serviceDuration<=end){
      const se=cur+serviceDuration;
      if(!busy.some(b=>cur<b.end&&se>b.start)) slots.push(minutesToTime(cur));
      cur+=15;
    }
  }
  return slots;
}

// ══ useSwipe ══
function useSwipe(onSwipeLeft, onSwipeRight, threshold = 50) {
  const touchStart = { x: 0, y: 0 };
  function onTouchStart(e) {
    touchStart.x = e.touches[0].clientX;
    touchStart.y = e.touches[0].clientY;
  }
  function onTouchEnd(e) {
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < threshold || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx < 0) onSwipeLeft(); else onSwipeRight();
  }
  return { onTouchStart, onTouchEnd };
}

        </div>
        <div style={{display:"flex",gap:16,alignItems:"center"}}>
          <button onClick={onDemo} style={{background:"none",border:"none",color:"#888",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>Demo</button>
          <button onClick={onBusiness} style={{background:"#B89A5A",border:"none",borderRadius:8,padding:"6px 14px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Peluquería</button>
        </div>
      </nav>

      {/* ── HERO ── */}
      <div style={{background:"#0e0e0e",padding:"48px 24px 40px",textAlign:"center"}}>
        <p style={{margin:"0 0 12px",fontSize:10,letterSpacing:3,color:"#B89A5A",fontWeight:700,textTransform:"uppercase"}}>Para peluquerías y centros de belleza</p>
        <h1 style={{margin:"0 0 14px",fontSize:32,fontWeight:800,color:"#fff",lineHeight:1.2,maxWidth:320,marginLeft:"auto",marginRight:"auto"}}>
          Tu peluquería<br/>en el móvil<br/>de tus clientes
        </h1>
        <p style={{margin:"0 0 10px",fontSize:13,color:"#666",lineHeight:1.6}}>
          Reservas 24/7 · Tu marca · Tus clientes<br/>Cuota fija · Sin comisión por reserva
        </p>
        <div style={{height:1,background:"linear-gradient(to right,transparent,#B89A5A,transparent)",margin:"20px auto",maxWidth:160}}/>
        <div style={{display:"flex",flexDirection:"column",gap:10,maxWidth:280,margin:"0 auto"}}>
          <button onClick={onDemo} style={{background:"#B89A5A",border:"none",borderRadius:12,padding:"14px",color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"inherit",letterSpacing:0.3}}>VER DEMO</button>
          <button onClick={onBusiness} style={{background:"rgba(255,255,255,0.07)",border:"1.5px solid rgba(184,154,90,0.3)",borderRadius:12,padding:"12px",color:"#ccc",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>SOY PELUQUERÍA</button>
        </div>
      </div>

      {/* ── TRES ACCESOS ── */}
      <div style={{padding:"32px 20px",display:"flex",flexDirection:"column",gap:12}}>
        <p style={{margin:"0 0 4px",textAlign:"center",fontSize:10,color:"#aaa",textTransform:"uppercase",letterSpacing:2}}>¿Qué quieres hacer?</p>
        {areas.map(a=>(
          <div key={a.id} style={{background: a.accent?"#B89A5A": a.light?"#fff":"#0e0e0e", borderRadius:16, padding:"22px 20px", border: a.light?"1.5px solid #F0EDE8":"none", cursor:"pointer"}} onClick={a.action}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div>
                <span style={{fontSize:10,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color: a.accent?"rgba(255,255,255,0.7)": a.light?"#B89A5A":"#B89A5A"}}>{a.label}</span>
                <p style={{margin:"4px 0 6px",fontSize:18,fontWeight:800,color: a.light&&!a.accent?"#1a1a1a":"#fff"}}>{a.btn.split(" ").slice(-2).join(" ")}</p>
                <p style={{margin:0,fontSize:13,color: a.light&&!a.accent?"#888":"rgba(255,255,255,0.7)",lineHeight:1.5}}>{a.desc}</p>
              </div>
              <span style={{fontSize:28,color: a.light&&!a.accent?"#B89A5A":"rgba(255,255,255,0.4)",marginLeft:12,flexShrink:0}}>{a.icon}</span>
            </div>
            <div style={{marginTop:14,background: a.accent?"rgba(255,255,255,0.15)": a.light?"#F8F7F5":"rgba(255,255,255,0.07)",borderRadius:10,padding:"10px 14px",display:"inline-block",width:"100%",boxSizing:"border-box"}}>
              <span style={{fontSize:13,fontWeight:800,color: a.light&&!a.accent?"#1a1a1a":"#fff"}}>{a.btn} →</span>
            </div>
          </div>
        ))}
      </div>

      {/* ── BENEFICIOS ── */}
      <div style={{padding:"8px 20px 32px",background:"#fff"}}>
        <p style={{margin:"0 0 14px",textAlign:"center",fontSize:11,color:"#aaa",fontWeight:600,textTransform:"uppercase",letterSpacing:1.5}}>Incluido en tu cuota</p>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center"}}>
          {benefits.map(b=>(
            <span key={b} style={{background:"#F8F7F5",border:"1.5px solid #F0EDE8",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,color:"#444"}}>✦ {b}</span>
          ))}
        </div>
      </div>

      {/* ── RECORDATORIOS (condensado) ── */}
      <div style={{padding:"8px 20px 32px"}}>
        <p style={{margin:"0 0 4px",textAlign:"center",fontSize:10,color:"#aaa",textTransform:"uppercase",letterSpacing:2}}>Reduce las ausencias</p>
        <h2 style={{margin:"0 0 16px",textAlign:"center",fontSize:20,fontWeight:800}}>Recordatorios automáticos</h2>
        {[
          {icon:"✉️",title:"Email",desc:"Confirmación + recordatorio 24h y 2h antes. Enlace para cancelar.",badge:"INCLUIDO"},
          {icon:"🔔",title:"Notificaciones push",desc:"Directo a la pantalla del móvil. Huecos de última hora y lista de espera.",badge:"INCLUIDO"},
        ].map(r=>(
          <div key={r.title} style={{background:"#0e0e0e",borderRadius:14,padding:"16px 18px",marginBottom:10}}>
            <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
              <span style={{fontSize:22}}>{r.icon}</span>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                  <p style={{margin:0,fontSize:14,fontWeight:800,color:"#fff"}}>{r.title}</p>
                  <span style={{background:"#B89A5A",color:"#fff",fontSize:9,fontWeight:800,padding:"2px 8px",borderRadius:20,whiteSpace:"nowrap"}}>{r.badge}</span>
                </div>
                <p style={{margin:0,fontSize:12,color:"#777",lineHeight:1.5}}>{r.desc}</p>
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* ── HUECOS / ESPERA (condensado) ── */}
      <div style={{padding:"8px 20px 32px",background:"#fff"}}>
        <h2 style={{margin:"0 0 16px",textAlign:"center",fontSize:20,fontWeight:800}}>Cero horas muertas</h2>
        {[
          {icon:"⚡",title:"Huecos de última hora",desc:"Cancelación detectada → push a clientes interesados → hueco lleno automáticamente."},
          {icon:"📋",title:"Lista de espera",desc:"Sin hueco disponible → el cliente se apunta → push inmediato cuando se libera uno."},
        ].map(h=>(
          <div key={h.title} style={{display:"flex",gap:14,padding:"16px 0",borderBottom:"1px solid #F0EDE8",alignItems:"flex-start"}}>
            <div style={{width:40,height:40,borderRadius:10,background:"#0e0e0e",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{h.icon}</div>
            <div>
              <p style={{margin:"0 0 3px",fontSize:14,fontWeight:800}}>{h.title}</p>
              <p style={{margin:0,fontSize:13,color:"#888",lineHeight:1.5}}>{h.desc}</p>
            </div>
          </div>
        ))}
      </div>

      {/* ── CTA FINAL ── */}
      <div style={{padding:"40px 24px",textAlign:"center",background:"#0e0e0e"}}>
        <h2 style={{margin:"0 0 8px",fontSize:22,fontWeight:800,color:"#fff"}}>¿Listo para verlo?</h2>
        <p style={{margin:"0 0 24px",fontSize:13,color:"#555"}}>Prueba la demo completa ahora, sin registro.</p>
        <div style={{display:"flex",flexDirection:"column",gap:10,maxWidth:280,margin:"0 auto"}}>
          <button onClick={()=>{onDemo();}} style={{background:"#B89A5A",border:"none",borderRadius:12,padding:14,color:"#fff",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>Ver demo · Vista cliente</button>
          <button onClick={onBusiness} style={{background:"rgba(255,255,255,0.07)",border:"1.5px solid rgba(255,255,255,0.12)",borderRadius:12,padding:12,color:"#ccc",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Ver demo · Panel del negocio</button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// BARRA DE DEMO — superpuesta sobre cliente o panel
// ============================================================
function DemoBanner({label,onBack,onReset}){
  return(
    <div style={{position:"fixed",top:0,left:0,right:0,zIndex:300,background:"rgba(17,17,17,0.95)",backdropFilter:"blur(8px)",borderBottom:"1px solid rgba(184,154,90,0.3)",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 16px",maxWidth:430,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{background:"#B89A5A",color:"#fff",fontSize:9,fontWeight:800,padding:"2px 8px",borderRadius:20,letterSpacing:1,textTransform:"uppercase"}}>DEMO</span>
        <span style={{fontSize:11,color:"#888"}}>{label}</span>
      </div>
      <div style={{display:"flex",gap:8}}>
        {onReset&&<button onClick={onReset} style={{background:"none",border:"1px solid rgba(184,154,90,0.4)",borderRadius:8,padding:"4px 10px",color:"#B89A5A",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Restablecer</button>}
        <button onClick={onBack} style={{background:"none",border:"none",color:"#888",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>← Salir</button>
      </div>
    </div>
  );
}

// ══ CustomerViews ══

function HomeView({onNav,appointments,onReservar}){
  const dow = todayNow.getDay();
  const schedule = businessConfig.schedule[dow];
  const isOpen = schedule ? (()=>{
    const now = todayNow.getHours()*60+todayNow.getMinutes();
    return now>=timeToMinutes(schedule.open)&&now<timeToMinutes(schedule.close);
  })() : false;

  const nextSlots = useMemo(()=>{
    const slots=[];
    for(let i=0;i<7&&slots.length<2;i++){
      const d=new Date(todayNow.getTime()+i*86400000);
      const dStr=d.toISOString().split("T")[0];
      for(const p of professionals){
        const avail=getAvailableSlots(dStr,p.id,30,appointments);
        if(avail.length>0&&!slots.find(s=>s.date===dStr)){
          slots.push({date:dStr,time:avail[0],profId:p.id});
          break;
        }
      }
    }
    return slots;
  },[appointments]);

  return (
    <div style={{paddingBottom:80}}>
      <BusinessHeader isOpen={isOpen} schedule={schedule}/>

      {/* CTA */}
      <div style={{padding:"20px 20px 0"}}>
        <button onClick={()=>onNav("booking")} style={{width:"100%",background:"#B89A5A",border:"none",borderRadius:14,padding:18,color:"#fff",fontSize:17,fontWeight:800,cursor:"pointer",letterSpacing:0.5,fontFamily:"inherit"}}>
          RESERVAR CITA
        </button>
      </div>

      {/* Próximos huecos */}
      {nextSlots.length>0&&(
        <div style={{padding:"14px 20px 0"}}>
          <Card>
            <p style={{margin:"0 0 10px",fontSize:11,color:"#888",fontWeight:700,textTransform:"uppercase",letterSpacing:1.2}}>Próximos huecos</p>
            {nextSlots.map((s,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:i<nextSlots.length-1?"1px solid #F5F5F5":"none"}}>
                <div>
                  <span style={{fontSize:14,fontWeight:700}}>{formatDateLabel(s.date)}</span>
                  <span style={{fontSize:14,color:"#B89A5A",marginLeft:8,fontWeight:800}}>{s.time}</span>
                </div>
                <button onClick={()=>onReservar(s)} style={{background:"#1a1a1a",color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  Reservar
                </button>
              </div>
            ))}
          </Card>
        </div>
      )}

      {/* Categorías */}
      <div style={{padding:"20px 20px 0"}}>
        <p style={{margin:"0 0 12px",fontSize:13,fontWeight:700}}>Servicios</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {categories.map(c=>(
            <button key={c.id} onClick={()=>onNav("services")} style={{background:"#fff",border:"1.5px solid #F0EDE8",borderRadius:12,padding:"13px 16px",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",gap:10,fontFamily:"inherit"}}>
              <span style={{fontSize:17}}>{c.icon}</span>
              <span style={{fontSize:12,fontWeight:700,color:"#1a1a1a"}}>{c.name}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Equipo */}
      <div style={{padding:"24px 20px 0"}}>
        <p style={{margin:"0 0 12px",fontSize:13,fontWeight:700}}>Nuestro equipo</p>
        <div style={{display:"flex",gap:10,overflowX:"auto",paddingBottom:4}}>
          {professionals.map(p=>(
            <div key={p.id} style={{minWidth:100,background:"#111",borderRadius:14,padding:"14px 10px",textAlign:"center",cursor:"pointer",flexShrink:0}} onClick={()=>onNav("booking")}>
              <Avatar initials={p.avatar} bg="#2C2C2C" color="#B89A5A" size={46}/>
              <p style={{margin:"8px 0 2px",fontSize:13,fontWeight:700,color:"#fff"}}>{p.name}</p>
              <p style={{margin:0,fontSize:10,color:"#777",lineHeight:1.3}}>{p.role}</p>
              <div style={{marginTop:5,display:"flex",justifyContent:"center",alignItems:"center",gap:2}}>
                <Stars rating={p.rating} size={10}/>
                <span style={{fontSize:10,color:"#B89A5A",fontWeight:800}}>{p.rating}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Huecos última hora */}
      <div style={{padding:"20px 20px 0"}}>
        <Card style={{background:"#111",border:"none"}}>
          <p style={{margin:"0 0 10px",fontSize:12,fontWeight:700,color:"#B89A5A",textTransform:"uppercase",letterSpacing:1}}>🔥 Última hora — hoy</p>
          {[
            {time:"17:45",prof:"Miguel",service:"Corte degradado",discount:"−10%"},
            {time:"18:30",prof:"Álex",service:"Corte + barba",discount:"−15%"},
          ].map(h=>(
            <div key={h.time} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #222"}}>
              <div>
                <span style={{fontSize:13,fontWeight:800,color:"#B89A5A"}}>{h.time}</span>
                <span style={{fontSize:12,color:"#888",marginLeft:8}}>{h.prof} · {h.service}</span>
              </div>
              <span style={{background:"rgba(184,154,90,0.15)",color:"#B89A5A",fontSize:11,fontWeight:800,padding:"2px 10px",borderRadius:20,border:"1px solid rgba(184,154,90,0.3)"}}>{h.discount}</span>
            </div>
          ))}
        </Card>
      </div>

      {/* Reseñas */}
      <div style={{padding:"24px 20px 0"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <p style={{margin:0,fontSize:13,fontWeight:700}}>Opiniones</p>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <Stars rating={businessConfig.rating} size={13}/>
            <span style={{fontSize:13,fontWeight:800,color:"#B89A5A"}}>{businessConfig.rating}</span>
            <span style={{fontSize:12,color:"#aaa"}}>({businessConfig.reviews})</span>
          </div>
        </div>
        {reviews.slice(0,3).map(r=>(
          <Card key={r.id} style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between"}}>
              <div>
                <p style={{margin:0,fontSize:13,fontWeight:700}}>{r.name}</p>
                <p style={{margin:"2px 0 0",fontSize:11,color:"#aaa"}}>{r.service} · {r.professional}</p>
              </div>
              <span style={{fontSize:11,color:"#bbb"}}>{r.date}</span>
            </div>
            <Stars rating={r.rating} size={12}/>
            <p style={{margin:"6px 0 0",fontSize:13,color:"#444",lineHeight:1.6}}>{r.text}</p>
          </Card>
        ))}
      </div>

      <StyleBot onReservar={()=>onNav("booking")}/>
    </div>
  );
}

function StyleBot({onReservar}){
  const [open,setOpen]=useState(false);
  const [step,setStep]=useState(0);
  const [answers,setAnswers]=useState({});
  const [result,setResult]=useState(null);
  const questions=[
    {q:"¿Qué buscas hoy?",opts:["Corte de pelo","Corte + barba","Solo barba","Color o mechas","Cejas o pestañas"]},
    {q:"¿Tienes preferencia de barbero?",opts:["Me da igual, el primero libre","Víctor","Miguel","Álex","Sara o Lucía"]},
    {q:"¿Cuánto tiempo tienes?",opts:["Menos de 30 min","30–45 min","45–60 min","Sin límite"]},
  ];
  function handleAnswer(ans){
    const na={...answers,[step]:ans};
    setAnswers(na);
    if(step<questions.length-1){setStep(step+1);}
    else{
      let rec={service:"Corte + Barba",professional:"Miguel",duration:"45 min",price:"27 €"};
      if(na[0]==="Solo barba") rec={service:"Arreglo de barba",professional:"Víctor",duration:"20 min",price:"14 €"};
      else if(na[0]==="Corte + barba"&&na[2]==="Sin límite") rec={service:"La experiencia completa",professional:"Víctor",duration:"75 min",price:"48 €"};
      else if(na[0]==="Color o mechas") rec={service:"Balayage",professional:"Sara",duration:"2 horas",price:"Desde 90 €"};
      else if(na[0]==="Cejas o pestañas") rec={service:"Laminado de cejas",professional:"Lucía",duration:"45 min",price:"38 €"};
      else if(na[2]==="Menos de 30 min") rec={service:"Corte hombre",professional:"Álex",duration:"30 min",price:"17 €"};
      setResult(rec);
    }
  }
  function reset(){setStep(0);setAnswers({});setResult(null);}
  return(
    <>
      <button onClick={()=>setOpen(!open)} aria-label="Abrir Style Bot" style={{position:"fixed",bottom:88,right:20,width:68,height:68,borderRadius:"50%",background:"transparent",border:"none",padding:0,cursor:"pointer",boxShadow:"0 6px 24px rgba(0,0,0,0.18)",zIndex:900,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <img src="/images/style-bot.png" alt="Style Bot" style={{width:"100%",height:"100%",objectFit:"contain",display:"block"}}/>
      </button>
      {open&&(
        <div style={{position:"fixed",bottom:164,right:20,width:280,background:"#fff",borderRadius:18,boxShadow:"0 8px 40px rgba(0,0,0,0.18)",zIndex:901,overflow:"hidden"}}>
          <div style={{background:"#111",padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <img src="/images/style-bot.png" alt="" style={{width:38,height:38,objectFit:"contain"}}/>
              <div>
                <p style={{margin:0,fontSize:13,fontWeight:800,color:"#fff"}}>STYLE BOT</p>
                <p style={{margin:0,fontSize:11,color:"#B89A5A"}}>Te ayudo a elegir</p>
              </div>
            </div>
            <button onClick={()=>{setOpen(false);reset();}} style={{background:"none",border:"none",color:"#555",fontSize:20,cursor:"pointer"}}>×</button>
          </div>
          <div style={{padding:16}}>
            {!result?(
              <>
                <div style={{marginBottom:8}}><div style={{height:3,background:"#F0EDE8",borderRadius:2}}><div style={{height:"100%",width:`${((step+1)/questions.length)*100}%`,background:"#B89A5A",borderRadius:2,transition:"width 0.3s"}}/></div></div>
                <p style={{fontSize:13,fontWeight:700,color:"#1a1a1a",marginBottom:10}}>{questions[step].q}</p>
                {questions[step].opts.map(o=>(
                  <button key={o} onClick={()=>handleAnswer(o)} style={{display:"block",width:"100%",background:"#F8F7F5",border:"1.5px solid #F0EDE8",borderRadius:10,padding:"10px 14px",fontSize:13,textAlign:"left",cursor:"pointer",marginBottom:6,fontFamily:"inherit",color:"#1a1a1a"}}>{o}</button>
                ))}
              </>
            ):(
              <div>
                <p style={{fontSize:12,color:"#888",margin:"0 0 8px"}}>Mi recomendación:</p>
                <div style={{background:"#111",borderRadius:12,padding:14,marginBottom:12}}>
                  <p style={{margin:"0 0 4px",fontWeight:800,fontSize:14,color:"#fff"}}>{result.service}</p>
                  <p style={{margin:"0 0 2px",fontSize:12,color:"#888"}}>con {result.professional}</p>
                  <p style={{margin:0,fontSize:12,color:"#B89A5A",fontWeight:600}}>{result.duration} · {result.price}</p>
                </div>
                <button onClick={()=>{onReservar();setOpen(false);}} style={{width:"100%",background:"#B89A5A",color:"#fff",border:"none",borderRadius:10,padding:"12px",fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit",marginBottom:8}}>
                  RESERVAR ESTE SERVICIO
                </button>
                <button onClick={reset} style={{width:"100%",background:"none",border:"none",color:"#aaa",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Empezar de nuevo</button>
              </div>
            )}
          </div>
        </div>
      )}
    </>
  );
}

// ============================================================
// SERVICIOS
// ============================================================
function ServicesView({onBookService}){
  const [search,setSearch]=useState("");
  const [activeCat,setActiveCat]=useState("all");
  const filtered=useMemo(()=>services.filter(s=>{
    const mc=activeCat==="all"||s.cat===activeCat;
    const ms=!search||s.name.toLowerCase().includes(search.toLowerCase())||s.desc.toLowerCase().includes(search.toLowerCase());
    return mc&&ms;
  }),[search,activeCat]);
  const grouped=useMemo(()=>{
    const m={};
    filtered.forEach(s=>{if(!m[s.cat])m[s.cat]=[];m[s.cat].push(s);});
    return m;
  },[filtered]);
  return(
    <div style={{paddingBottom:80}}>
      <div style={{padding:"24px 20px 16px",background:"#fff",position:"sticky",top:0,zIndex:10,borderBottom:"1px solid #F0EDE8"}}>
        <h2 style={{margin:"0 0 12px",fontSize:20,fontWeight:800}}>Servicios</h2>
        <div style={{position:"relative"}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar servicio..." style={{width:"100%",padding:"11px 16px 11px 40px",border:"1.5px solid #E8E8E8",borderRadius:12,fontSize:14,fontFamily:"inherit",background:"#F8F7F5",outline:"none",boxSizing:"border-box"}}/>
          <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:16,color:"#aaa"}}>🔍</span>
        </div>
        <div style={{display:"flex",gap:8,overflowX:"auto",paddingTop:12,paddingBottom:2}}>
          <button onClick={()=>setActiveCat("all")} style={{whiteSpace:"nowrap",padding:"6px 14px",borderRadius:20,border:"none",background:activeCat==="all"?"#1a1a1a":"#F0EDE8",color:activeCat==="all"?"#fff":"#666",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Todos</button>
          {categories.map(c=>(
            <button key={c.id} onClick={()=>setActiveCat(c.id)} style={{whiteSpace:"nowrap",padding:"6px 14px",borderRadius:20,border:"none",background:activeCat===c.id?"#1a1a1a":"#F0EDE8",color:activeCat===c.id?"#fff":"#666",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{c.name}</button>
          ))}
        </div>
      </div>
      <div style={{padding:"16px 20px"}}>
        {Object.entries(grouped).map(([catId,svcs])=>{
          const cat=categories.find(c=>c.id===catId);
          return(
            <div key={catId} style={{marginBottom:24}}>
              <p style={{margin:"0 0 10px",fontSize:11,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:1.2}}>{cat?.name||catId}</p>
              {svcs.map(s=>(
                <div key={s.id} onClick={()=>onBookService(s)} style={{background:"#fff",borderRadius:14,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(0,0,0,0.05)",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start",border:"1.5px solid transparent"}}>
                  <div style={{flex:1,marginRight:12}}>
                    <p style={{margin:"0 0 3px",fontSize:15,fontWeight:700}}>{s.name}</p>
                    <p style={{margin:"0 0 6px",fontSize:12,color:"#888"}}>{s.desc}</p>
                    <span style={{fontSize:12,color:"#aaa"}}>⏱ {s.duration} min</span>
                  </div>
                  <div style={{textAlign:"right"}}>
                    <p style={{margin:0,fontSize:16,fontWeight:800,color:"#1a1a1a"}}>
                      {s.priceFrom&&<span style={{fontSize:11,fontWeight:400,color:"#888"}}>desde </span>}
                      {s.price} €
                    </p>
                    <span style={{fontSize:11,color:"#B89A5A",fontWeight:700}}>Reservar →</span>
                  </div>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// FLUJO DE RESERVA
// ============================================================
function BookingView({appointments,onAppointmentCreated,initialService}){
  const [step,setStep]=useState(initialService?1:0);
  const [selectedService,setSelectedService]=useState(initialService||null);
  const [selectedExtras,setSelectedExtras]=useState([]);
  const [selectedProfessional,setSelectedProfessional]=useState(null);
  const [selectedDate,setSelectedDate]=useState(null);
  const [selectedTime,setSelectedTime]=useState(null);
  const [clientName,setClientName]=useState("");
  const [clientPhone,setClientPhone]=useState("");
  const [clientEmail,setClientEmail]=useState("");
  const [notes,setNotes]=useState("");
  const [privacyOk,setPrivacyOk]=useState(false);
  const [confirmResult,setConfirmResult]=useState(null);
  const [error,setError]=useState("");
  const [search,setSearch]=useState("");

  const totalDuration=useMemo(()=>!selectedService?0:selectedService.duration+selectedExtras.reduce((s,eid)=>s+(extrasData[eid]?.duration||0),0),[selectedService,selectedExtras]);
  const totalPrice=useMemo(()=>!selectedService?0:selectedService.price+selectedExtras.reduce((s,eid)=>s+(extrasData[eid]?.price||0),0),[selectedService,selectedExtras]);

  const availableSlots=useMemo(()=>{
    if(!selectedDate||!selectedProfessional||selectedProfessional.id==="any") return [];
    return getAvailableSlots(selectedDate,selectedProfessional.id,totalDuration,appointments);
  },[selectedDate,selectedProfessional,totalDuration,appointments]);

  const compatibleProfs=useMemo(()=>!selectedService?professionals:professionals.filter(p=>p.serviceIds.includes(selectedService.id)),[selectedService]);

  const availableDates=useMemo(()=>{
    const dates=[];
    for(let i=0;i<14;i++){
      const d=new Date(todayNow.getTime()+i*86400000);
      const dStr=d.toISOString().split("T")[0];
      if(businessConfig.schedule[d.getDay()]) dates.push(dStr);
    }
    return dates;
  },[]);

  function toggleExtra(eid){setSelectedExtras(p=>p.includes(eid)?p.filter(e=>e!==eid):[...p,eid]);}

  function handleConfirm(){
    if(!clientName.trim()||!clientPhone.trim()||!privacyOk){setError("Completa nombre, teléfono y acepta la política de privacidad.");return;}
    setError("");
    const profId=selectedProfessional.id==="any"
      ?compatibleProfs.find(p=>getAvailableSlots(selectedDate,p.id,totalDuration,appointments).includes(selectedTime))?.id
      :selectedProfessional.id;
    if(!profId){setError("No se encontró disponibilidad. Por favor elige otra hora.");return;}
    const current=getAvailableSlots(selectedDate,profId,totalDuration,appointments);
    if(!current.includes(selectedTime)){setError("Este horario acaba de ser reservado. Elige otro.");setStep(3);return;}
    const newApt={id:"apt"+Date.now(),date:selectedDate,time:selectedTime,professionalId:profId,serviceId:selectedService.id,clientName,clientPhone,clientEmail,notes,status:"confirmed",duration:totalDuration,price:totalPrice,code:generateBookingCode()};
    onAppointmentCreated(newApt);
    setConfirmResult(newApt);
    setStep(6);
  }

  function reset(){setStep(0);setSelectedService(null);setSelectedExtras([]);setSelectedProfessional(null);setSelectedDate(null);setSelectedTime(null);setClientName("");setClientPhone("");setClientEmail("");setNotes("");setPrivacyOk(false);setConfirmResult(null);setError("");}

  const SI=({current,total})=>(
    <div style={{display:"flex",gap:5,padding:"0 20px 16px"}}>
      {Array.from({length:total}).map((_,i)=>(
        <div key={i} style={{flex:1,height:3,borderRadius:2,background:i<current?"#1a1a1a":i===current?"#B89A5A":"#F0EDE8",transition:"background 0.3s"}}/>
      ))}
    </div>
  );

  if(step===6&&confirmResult){
    const prof=professionals.find(p=>p.id===confirmResult.professionalId);
    const svc=services.find(s=>s.id===confirmResult.serviceId);
    return(
      <div style={{padding:20,paddingBottom:80,textAlign:"center"}}>
        <div style={{background:"#111",borderRadius:20,padding:"40px 20px",marginBottom:20,color:"#fff"}}>
          <div style={{width:60,height:60,borderRadius:"50%",background:"rgba(184,154,90,0.15)",border:"2px solid #B89A5A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 16px",color:"#B89A5A"}}>✓</div>
          <h2 style={{margin:"0 0 8px",fontSize:24,fontWeight:800}}>¡Cita reservada!</h2>
          <p style={{margin:"0 0 20px",color:"#666",fontSize:14}}>Te esperamos en Victor Monió Barbería</p>
          <div style={{background:"rgba(184,154,90,0.1)",border:"1px solid rgba(184,154,90,0.3)",borderRadius:12,padding:"14px 20px",marginBottom:16}}>
            <p style={{margin:0,fontSize:12,color:"#B89A5A"}}>Código de reserva</p>
            <p style={{margin:"4px 0 0",fontSize:22,fontWeight:800,letterSpacing:3,color:"#B89A5A"}}>{confirmResult.code}</p>
          </div>
          <div style={{textAlign:"left"}}>
            {[["Servicio",svc?.name],["Profesional",prof?.name],["Fecha",formatDateShort(confirmResult.date)],["Hora",confirmResult.time],["Duración",`${confirmResult.duration} min`],["Precio",`${confirmResult.price} €`]].map(([l,v])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
                <span style={{fontSize:13,color:"#666"}}>{l}</span>
                <span style={{fontSize:13,fontWeight:700}}>{v}</span>
              </div>
            ))}
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Btn variant="primary" style={{width:"100%"}} onClick={()=>{}}>Añadir al calendario</Btn>
          <Btn variant="outline" style={{width:"100%"}} onClick={()=>{}}>Cómo llegar</Btn>
          <Btn variant="ghost" style={{width:"100%"}} onClick={reset}>Nueva reserva</Btn>
        </div>
        <p style={{fontSize:11,color:"#aaa",marginTop:16,lineHeight:1.7}}>Cancelación gratuita hasta 24h antes de la cita.</p>
      </div>
    );
  }

  return(
    <div style={{paddingBottom:80}}>
      <div style={{padding:"24px 20px 12px"}}>
        <h2 style={{margin:0,fontSize:20,fontWeight:800}}>Reservar cita</h2>
      </div>
      <SI current={step} total={6}/>

      {/* PASO 0 */}
      {step===0&&(
        <div style={{padding:"0 20px"}}>
          <p style={{fontSize:13,color:"#888",marginBottom:16}}>¿Qué servicio necesitas?</p>
          <div style={{position:"relative",marginBottom:16}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar..." style={{width:"100%",padding:"11px 16px 11px 40px",border:"1.5px solid #E8E8E8",borderRadius:12,fontSize:14,fontFamily:"inherit",background:"#F8F7F5",outline:"none",boxSizing:"border-box"}}/>
            <span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",color:"#aaa"}}>🔍</span>
          </div>
          {categories.map(cat=>{
            const cs=services.filter(s=>s.cat===cat.id&&(!search||s.name.toLowerCase().includes(search.toLowerCase())));
            if(!cs.length) return null;
            return(
              <div key={cat.id} style={{marginBottom:20}}>
                <p style={{margin:"0 0 8px",fontSize:11,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:1}}>{cat.name}</p>
                {cs.map(s=>(
                  <div key={s.id} onClick={()=>{setSelectedService(s);setStep(1);}} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",background:"#fff",borderRadius:12,marginBottom:8,cursor:"pointer",border:"1.5px solid #F0EDE8"}}>
                    <div>
                      <p style={{margin:0,fontSize:14,fontWeight:700}}>{s.name}</p>
                      <p style={{margin:"2px 0 0",fontSize:12,color:"#888"}}>{s.duration} min</p>
                    </div>
                    <span style={{fontSize:15,fontWeight:800}}>{s.priceFrom&&<span style={{fontSize:11,color:"#888",fontWeight:400}}>desde </span>}{s.price} €</span>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}

      {/* PASO 1 */}
      {step===1&&selectedService&&(
        <div style={{padding:"0 20px"}}>
          <Card style={{marginBottom:16}}>
            <p style={{margin:"0 0 4px",fontSize:16,fontWeight:800}}>{selectedService.name}</p>
            <p style={{margin:"0 0 8px",fontSize:13,color:"#888"}}>{selectedService.desc}</p>
            <div style={{display:"flex",gap:10}}>
              <Badge>⏱ {selectedService.duration} min</Badge>
              <Badge color="#B89A5A" bg="#FBF5EE">{selectedService.price} €</Badge>
            </div>
          </Card>
          {selectedService.extras.length>0&&(
            <div style={{marginBottom:16}}>
              <p style={{margin:"0 0 10px",fontSize:13,fontWeight:700}}>Extras opcionales</p>
              {selectedService.extras.map(eid=>{
                const ex=extrasData[eid];if(!ex) return null;
                const sel=selectedExtras.includes(eid);
                return(
                  <div key={eid} onClick={()=>toggleExtra(eid)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",background:sel?"#1a1a1a":"#fff",borderRadius:12,marginBottom:8,cursor:"pointer",border:`1.5px solid ${sel?"#1a1a1a":"#F0EDE8"}`,color:sel?"#fff":"#1a1a1a"}}>
                    <div><p style={{margin:0,fontSize:14,fontWeight:700}}>{ex.name}</p><p style={{margin:0,fontSize:12,color:sel?"#888":"#888"}}>+{ex.duration} min</p></div>
                    <span style={{fontWeight:800}}>+{ex.price} €</span>
                  </div>
                );
              })}
            </div>
          )}
          <div style={{background:"#F8F7F5",borderRadius:12,padding:14,marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:13,color:"#888"}}>Duración</span><span style={{fontWeight:700}}>{totalDuration} min</span></div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:6}}><span style={{fontSize:13,color:"#888"}}>Total</span><span style={{fontWeight:800,fontSize:18,color:"#B89A5A"}}>{totalPrice} €</span></div>
          </div>
          <Btn onClick={()=>setStep(2)} style={{width:"100%"}}>Continuar →</Btn>
          <button onClick={()=>setStep(0)} style={{display:"block",margin:"12px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Cambiar servicio</button>
        </div>
      )}

      {/* PASO 2 */}
      {step===2&&(
        <div style={{padding:"0 20px"}}>
          <p style={{fontSize:13,color:"#888",marginBottom:16}}>¿Con quién quieres la cita?</p>
          <div onClick={()=>{setSelectedProfessional({id:"any",name:"Cualquier profesional"});setStep(3);}} style={{display:"flex",alignItems:"center",gap:14,padding:16,background:"#fff",borderRadius:14,marginBottom:10,cursor:"pointer",border:"1.5px solid #F0EDE8"}}>
            <div style={{width:48,height:48,borderRadius:"50%",background:"#F0EDE8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>✦</div>
            <div><p style={{margin:0,fontSize:15,fontWeight:700}}>Cualquier profesional</p><p style={{margin:0,fontSize:12,color:"#888"}}>El primero disponible</p></div>
          </div>
          {compatibleProfs.map(p=>(
            <div key={p.id} onClick={()=>{setSelectedProfessional(p);setStep(3);}} style={{display:"flex",alignItems:"center",gap:14,padding:16,background:"#fff",borderRadius:14,marginBottom:10,cursor:"pointer",border:`1.5px solid ${selectedProfessional?.id===p.id?"#1a1a1a":"#F0EDE8"}`}}>
              <Avatar initials={p.avatar} size={48}/>
              <div style={{flex:1}}>
                <p style={{margin:0,fontSize:15,fontWeight:800}}>{p.name}</p>
                <p style={{margin:"2px 0 4px",fontSize:12,color:"#888"}}>{p.role}</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{p.specialties.slice(0,2).map(s=><Badge key={s}>{s}</Badge>)}</div>
              </div>
              <div style={{textAlign:"right"}}><Stars rating={p.rating} size={12}/><p style={{margin:"2px 0 0",fontSize:12,color:"#B89A5A",fontWeight:800}}>{p.rating}</p></div>
            </div>
          ))}
          <button onClick={()=>setStep(1)} style={{display:"block",margin:"12px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Atrás</button>
        </div>
      )}

      {/* PASO 3 */}
      {step===3&&(
        <div style={{padding:"0 20px"}}>
          <p style={{fontSize:13,color:"#888",marginBottom:16}}>¿Cuándo quieres la cita?</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {availableDates.map(d=>{
              const hasSlots=selectedProfessional?.id==="any"
                ?professionals.some(p=>getAvailableSlots(d,p.id,totalDuration,appointments).length>0)
                :getAvailableSlots(d,selectedProfessional.id,totalDuration,appointments).length>0;
              return(
                <button key={d} onClick={()=>{if(hasSlots){setSelectedDate(d);setSelectedTime(null);setStep(4);}}} disabled={!hasSlots} style={{padding:"14px 10px",background:selectedDate===d?"#1a1a1a":hasSlots?"#fff":"#F8F7F5",border:`1.5px solid ${selectedDate===d?"#1a1a1a":hasSlots?"#F0EDE8":"#F0EDE8"}`,borderRadius:12,cursor:hasSlots?"pointer":"default",color:selectedDate===d?"#fff":hasSlots?"#1a1a1a":"#ccc",fontFamily:"inherit",fontSize:13,fontWeight:700}}>
                  <div>{formatDateLabel(d)}</div>
                  {!hasSlots&&<div style={{fontSize:10,marginTop:3,opacity:0.7}}>Sin disponibilidad</div>}
                </button>
              );
            })}
          </div>
          <button onClick={()=>setStep(2)} style={{display:"block",margin:"16px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Atrás</button>
        </div>
      )}

      {/* PASO 4 */}
      {step===4&&(
        <div style={{padding:"0 20px"}}>
          <p style={{fontSize:13,color:"#888",marginBottom:4}}>Horas disponibles</p>
          <p style={{fontSize:15,fontWeight:800,marginBottom:16}}>{formatDateLabel(selectedDate)}</p>
          {availableSlots.length===0?(
            <div style={{textAlign:"center",padding:40}}>
              <p style={{fontSize:14,color:"#888"}}>No hay huecos disponibles este día.</p>
              <Btn variant="outline" onClick={()=>setStep(3)} style={{marginTop:12}}>Cambiar fecha</Btn>
            </div>
          ):(
            <>
              {(()=>{
                const am=availableSlots.filter(t=>parseInt(t)<14);
                const pm=availableSlots.filter(t=>parseInt(t)>=14);
                return(
                  <>
                    {am.length>0&&<p style={{fontSize:11,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Mañana</p>}
                    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
                      {am.map(t=><button key={t} onClick={()=>{setSelectedTime(t);setStep(5);}} style={{padding:"12px 6px",border:`1.5px solid ${selectedTime===t?"#1a1a1a":"#F0EDE8"}`,borderRadius:10,background:selectedTime===t?"#1a1a1a":"#fff",color:selectedTime===t?"#fff":"#1a1a1a",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>{t}</button>)}
                    </div>
                    {pm.length>0&&<p style={{fontSize:11,fontWeight:700,color:"#aaa",textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Tarde</p>}
                    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                      {pm.map(t=><button key={t} onClick={()=>{setSelectedTime(t);setStep(5);}} style={{padding:"12px 6px",border:`1.5px solid ${selectedTime===t?"#1a1a1a":"#F0EDE8"}`,borderRadius:10,background:selectedTime===t?"#1a1a1a":"#fff",color:selectedTime===t?"#fff":"#1a1a1a",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>{t}</button>)}
                    </div>
                  </>
                );
              })()}
            </>
          )}
          <button onClick={()=>setStep(3)} style={{display:"block",margin:"16px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Cambiar fecha</button>
        </div>
      )}

      {/* PASO 5 */}
      {step===5&&(
        <div style={{padding:"0 20px"}}>
          <Card style={{marginBottom:16}}>
            <p style={{margin:"0 0 10px",fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1}}>Resumen</p>
            {[["Servicio",`${selectedService.name}${selectedExtras.length>0?" + extras":""}`],["Profesional",selectedProfessional?.id==="any"?"Cualquier profesional":selectedProfessional?.name],["Fecha",formatDateShort(selectedDate)],["Hora",selectedTime],["Duración",`${totalDuration} min`]].map(([l,v])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #F8F7F5"}}>
                <span style={{fontSize:13,color:"#888"}}>{l}</span>
                <span style={{fontSize:13,fontWeight:700}}>{v}</span>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0 0"}}>
              <span style={{fontSize:15,fontWeight:800}}>Total</span>
              <span style={{fontSize:18,fontWeight:800,color:"#B89A5A"}}>{totalPrice} €</span>
            </div>
          </Card>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {[["Tu nombre *",clientName,setClientName,"text"],["Teléfono *",clientPhone,setClientPhone,"tel"],["Email (opcional)",clientEmail,setClientEmail,"email"]].map(([ph,val,setter,type])=>(
              <input key={ph} value={val} onChange={e=>setter(e.target.value)} placeholder={ph} type={type} style={{padding:"13px 16px",border:"1.5px solid #E8E8E8",borderRadius:12,fontSize:14,fontFamily:"inherit",outline:"none"}}/>
            ))}
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Notas para el profesional (opcional)" rows={3} style={{padding:"13px 16px",border:"1.5px solid #E8E8E8",borderRadius:12,fontSize:14,fontFamily:"inherit",outline:"none",resize:"vertical"}}/>
            <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer"}}>
              <input type="checkbox" checked={privacyOk} onChange={e=>setPrivacyOk(e.target.checked)} style={{marginTop:2}}/>
              <span style={{fontSize:13,color:"#666",lineHeight:1.5}}>Acepto la política de privacidad y recibir comunicaciones sobre mi cita.</span>
            </label>
          </div>
          {error&&<div style={{background:"#FFF0EE",borderRadius:10,padding:"12px 16px",marginTop:12,fontSize:13,color:"#C0392B"}}>{error}</div>}
          <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:10}}>
            <Btn onClick={handleConfirm} style={{width:"100%"}}>CONFIRMAR RESERVA</Btn>
            <p style={{textAlign:"center",fontSize:12,color:"#aaa",margin:0}}>Cancelación gratuita hasta 24h antes</p>
          </div>
          <button onClick={()=>setStep(4)} style={{display:"block",margin:"12px auto 0",background:"none",border:"none",color:"#888",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>← Cambiar hora</button>
        </div>
      )}
    </div>
  );
}

function AppointmentsView({appointments}){
  const [tab,setTab]=useState("upcoming");
  const upcoming=appointments.filter(a=>(a.date>todayStr||(a.date===todayStr&&a.status==="confirmed"))&&a.status!=="cancelled");
  const past=appointments.filter(a=>(a.date<todayStr||a.status==="completed")&&a.status!=="cancelled");
  const cancelled=appointments.filter(a=>a.status==="cancelled");
  const tabs=[{id:"upcoming",label:"Próximas",list:upcoming},{id:"past",label:"Anteriores",list:past},{id:"cancelled",label:"Canceladas",list:cancelled}];
  function AptCard({apt}){
    const prof=professionals.find(p=>p.id===apt.professionalId);
    const svc=services.find(s=>s.id===apt.serviceId);
    const sc={confirmed:{bg:"#EFF8F0",c:"#2E7D32"},completed:{bg:"#F0EDE8",c:"#888"},cancelled:{bg:"#FFF0EE",c:"#C0392B"}}[apt.status]||{bg:"#F0EDE8",c:"#888"};
    return(
      <Card style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
          <div><p style={{margin:0,fontSize:15,fontWeight:800}}>{svc?.name||apt.serviceId}</p><p style={{margin:"2px 0 0",fontSize:12,color:"#888"}}>con {prof?.name}</p></div>
          <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,background:sc.bg,color:sc.c}}>{{confirmed:"Confirmada",completed:"Completada",cancelled:"Cancelada"}[apt.status]}</span>
        </div>
        <Divider/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[["Fecha",formatDateLabel(apt.date)],["Hora",apt.time],["Duración",`${apt.duration} min`],["Precio",`${apt.price} €`]].map(([l,v])=>(
            <div key={l}><p style={{margin:0,fontSize:11,color:"#aaa"}}>{l}</p><p style={{margin:"2px 0 0",fontSize:13,fontWeight:700}}>{v}</p></div>
          ))}
        </div>
        {apt.code&&<div style={{marginTop:10,background:"#111",borderRadius:8,padding:"8px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:11,color:"#666"}}>Código</span><span style={{fontSize:13,fontWeight:800,letterSpacing:2,color:"#B89A5A"}}>{apt.code}</span></div>}
        {apt.status==="confirmed"&&<div style={{display:"flex",gap:8,marginTop:12}}><button style={{flex:1,background:"#F8F7F5",border:"1.5px solid #F0EDE8",borderRadius:10,padding:10,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Modificar</button><button style={{flex:1,background:"#FFF0EE",border:"1.5px solid #FCCABA",borderRadius:10,padding:10,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:"#C0392B"}}>Cancelar</button></div>}
        {apt.status==="completed"&&<button style={{width:"100%",marginTop:10,background:"#1a1a1a",color:"#fff",border:"none",borderRadius:10,padding:10,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Repetir reserva</button>}
      </Card>
    );
  }
  return(
    <div style={{paddingBottom:80}}>
      <div style={{padding:"24px 20px 0",background:"#fff",borderBottom:"1px solid #F0EDE8"}}>
        <h2 style={{margin:"0 0 16px",fontSize:20,fontWeight:800}}>Mis citas</h2>
        <div style={{display:"flex"}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0",border:"none",background:"none",fontFamily:"inherit",fontSize:13,fontWeight:700,cursor:"pointer",color:tab===t.id?"#1a1a1a":"#aaa",borderBottom:`2px solid ${tab===t.id?"#1a1a1a":"transparent"}`,transition:"all 0.2s"}}>
              {t.label}
              {t.list.length>0&&<span style={{marginLeft:4,fontSize:11,background:tab===t.id?"#1a1a1a":"#F0EDE8",color:tab===t.id?"#fff":"#888",borderRadius:20,padding:"1px 7px"}}>{t.list.length}</span>}
            </button>
          ))}
        </div>
      </div>
      <div style={{padding:20}}>
        {tabs.find(t=>t.id===tab)?.list.length===0?(
          <div style={{textAlign:"center",padding:40,color:"#aaa"}}><div style={{fontSize:40,marginBottom:12}}>📅</div><p style={{fontSize:14}}>No hay citas en esta sección</p></div>
        ):(
          tabs.find(t=>t.id===tab)?.list.map(a=><AptCard key={a.id} apt={a}/>)
        )}
      </div>
    </div>
  );
}

  const items=[{id:"home",icon:"◈",label:"Inicio"},{id:"services",icon:"✂",label:"Servicios"},{id:"booking",icon:"＋",label:"Reservar",accent:true},{id:"appointments",icon:"◫",label:"Mis citas"},{id:"profile",icon:"◎",label:"Perfil"}];
  return(
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#fff",borderTop:"1px solid #F0EDE8",display:"flex",zIndex:100,maxWidth:430,margin:"0 auto"}}>

}

function LoginView({ onLogin, onBack, context = "appointments" }) {
  const [phone, setPhone] = useState("");
  const [name, setName] = useState("");
  const [step, setStep] = useState("form"); // form | otp | ok
  const [otp, setOtp] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const contextMsg = {
    appointments: { icon: "◫", title: "Mis citas", desc: "Accede para ver y gestionar tus reservas." },
    profile: { icon: "◎", title: "Mi perfil", desc: "Accede para ver tu historial y preferencias." },
  }[context] || { icon: "◎", title: "Acceder", desc: "" };

  function handleSendOtp() {
    if (!phone.trim() || phone.trim().length < 9) { setError("Introduce un teléfono válido."); return; }
    if (!name.trim()) { setError("Introduce tu nombre."); return; }
    setError("");
    setLoading(true);
    setTimeout(() => { setLoading(false); setStep("otp"); }, 1200);
  }

  function handleVerifyOtp() {
    if (otp.length < 4) { setError("Introduce el código de 4 dígitos."); return; }
    setError("");
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      // En demo aceptamos cualquier código
      onLogin({ name: name.trim(), phone: phone.trim() });
    }, 1000);
  }

  function handleDemoAccess() {
    onLogin({ name: "Cliente Demo", phone: "666000000" });
  }

  return (
    <div style={{ minHeight: "100vh", background: "#F8F7F5", display: "flex", flexDirection: "column" }}>
      {/* Header */}
      <div style={{ background: "#0e0e0e", padding: "20px 20px 24px" }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: "#B89A5A", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", marginBottom: 20, padding: 0, display: "flex", alignItems: "center", gap: 6 }}>
          ← Volver

                  />
                </div>
              </div>

                onClick={handleSendOtp}
                disabled={loading}
                style={{ width: "100%", marginTop: 16, background: "#1a1a1a", border: "none", borderRadius: 12, padding: "15px", color: "#fff", fontSize: 15, fontWeight: 800, cursor: loading ? "wait" : "pointer", fontFamily: "inherit", opacity: loading ? 0.7 : 1 }}
              >
                {loading ? "Enviando código..." : "Enviar código →"}
              </button>

              <p style={{ margin: "12px 0 0", fontSize: 12, color: "#aaa", textAlign: "center", lineHeight: 1.6 }}>
                Te enviaremos un SMS con un código de verificación de 4 dígitos.

            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "4px 0" }}>
              <div style={{ flex: 1, height: 1, background: "#E8E8E8" }} />
              <span style={{ fontSize: 12, color: "#bbb", fontWeight: 600 }}>o</span>
              <div style={{ flex: 1, height: 1, background: "#E8E8E8" }} />
            </div>

            <button
              onClick={handleDemoAccess}
              style={{ width: "100%", background: "rgba(184,154,90,0.1)", border: "1.5px solid rgba(184,154,90,0.35)", borderRadius: 12, padding: "14px", color: "#B89A5A", fontSize: 14, fontWeight: 800, cursor: "pointer", fontFamily: "inherit" }}

            </p>

        )}

            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <div style={{ width: 52, height: 52, borderRadius: "50%", background: "#F8F7F5", border: "2px solid #B89A5A", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, margin: "0 auto 12px" }}>📱</div>
              <p style={{ margin: "0 0 4px", fontSize: 15, fontWeight: 800 }}>Código enviado</p>
              <p style={{ margin: 0, fontSize: 13, color: "#888", lineHeight: 1.5 }}>
                Hemos enviado un SMS al<br />
                <strong style={{ color: "#1a1a1a" }}>+34 {phone}</strong>
              </p>
            </div>

            <label style={{ display: "block", fontSize: 11, color: "#888", marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.8, fontWeight: 700 }}>Código de 4 dígitos</label>
            <input
              value={otp} onChange={e => { setOtp(e.target.value.replace(/\D/g, "").slice(0, 4)); setError(""); }}
              placeholder="• • • •" type="tel" maxLength={4}
              autoFocus
              style={{ width: "100%", padding: "16px", border: "1.5px solid #E8E8E8", borderRadius: 12, fontSize: 28, fontFamily: "inherit", outline: "none", textAlign: "center", letterSpacing: 12, boxSizing: "border-box", background: "#FAFAFA", fontWeight: 800 }}
            />

            {error && <p style={{ margin: "10px 0 0", fontSize: 13, color: "#C0392B", background: "#FFF0EE", borderRadius: 8, padding: "8px 12px" }}>{error}</p>}

            <button
              onClick={handleVerifyOtp}
              disabled={loading || otp.length < 4}
              style={{ width: "100%", marginTop: 16, background: "#1a1a1a", border: "none", borderRadius: 12, padding: "15px", color: "#fff", fontSize: 15, fontWeight: 800, cursor: (loading || otp.length < 4) ? "default" : "pointer", fontFamily: "inherit", opacity: (loading || otp.length < 4) ? 0.5 : 1 }}
            >
              {loading ? "Verificando..." : "Acceder"}
            </button>

            <div style={{ marginTop: 16, textAlign: "center" }}>
              <button onClick={() => { setStep("form"); setOtp(""); setError(""); }} style={{ background: "none", border: "none", color: "#888", fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>
                ← Cambiar número
              </button>
              <span style={{ color: "#ddd", margin: "0 10px" }}>·</span>
              <button onClick={handleSendOtp} style={{ background: "none", border: "none", color: "#B89A5A", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                Reenviar SMS
              </button>
            </div>

            {/* Hint para la demo */}
            <div style={{ marginTop: 16, background: "#F8F7F5", borderRadius: 10, padding: "10px 14px", border: "1px dashed #E0E0E0" }}>
              <p style={{ margin: 0, fontSize: 11, color: "#aaa", textAlign: "center" }}>
                Demo: introduce cualquier código de 4 dígitos
              </p>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function ProfileViewLoggedIn({ user, onLogout }) {
  return (

            {user.name[0].toUpperCase()}
          </div>
          <div>
            <p style={{ margin: 0, fontSize: 18, fontWeight: 800, color: "#fff" }}>{user.name}</p>

          ].map((item, i, arr) => (
            <div key={item.label} style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 18px", borderBottom: i < arr.length - 1 ? "1px solid #F5F5F5" : "none", cursor: "pointer" }}>
              <span style={{ fontSize: 20, color: "#B89A5A", width: 28 }}>{item.icon}</span>
              <div style={{ flex: 1 }}>

          <p style={{ margin: "0 0 12px", fontSize: 13, fontWeight: 800 }}>Victor Monió Barbería</p>
          {[["Dirección", "Calle Colón 14, Valencia"], ["Teléfono", "963 000 000"], ["Horario L–V", "09:00–20:00"], ["Horario sábado", "09:00–15:00"], ["Dom. y Lun.", "Cerrado"]].map(([l, v]) => (
            <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: "1px solid #F8F7F5" }}>
              <span style={{ fontSize: 13, color: "#888" }}>{l}</span>
              <span style={{ fontSize: 13, fontWeight: 700 }}>{v}</span>
            </div>
          ))}
        </div>

        {/* Cerrar sesión */}
        <button
          onClick={onLogout}
          style={{ width: "100%", background: "none", border: "1.5px solid #E8E8E8", borderRadius: 12, padding: "13px", color: "#888", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}
        >
          Cerrar sesión
        </button>
      </div>
    </div>
  );
}

function AdminStats({appointments}){

  const topServices=Object.entries(byService).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const byProf={};
  appointments.filter(a=>a.status!=="cancelled").forEach(a=>{const p=professionals.find(pr=>pr.id===a.professionalId);byProf[p?.name||a.professionalId]=(byProf[p?.name||a.professionalId]||0)+1;});

      <h3 style={{margin:"0 0 16px",fontSize:16,fontWeight:800}}>Estadísticas</h3>

          <Card key={s.l} style={{textAlign:"center"}}><p style={{margin:"0 0 4px",fontSize:10,color:"#aaa",textTransform:"uppercase",letterSpacing:1}}>{s.l}</p><p style={{margin:0,fontSize:22,fontWeight:800,color:s.c}}>{s.v}</p></Card>
        ))}
      </div>
      <Card style={{marginBottom:16}}>
        <p style={{margin:"0 0 12px",fontSize:13,fontWeight:800}}>Servicios más solicitados</p>
        {topServices.map(([name,count])=>(
          <div key={name}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:13,color:"#444"}}>{name}</span><span style={{fontSize:13,fontWeight:700}}>{count}</span></div>

function ClientApp({ appointments, onAppointmentCreated, demoMode=false, onExitDemo }){
  const [clientNav,setClientNav]=useState("home");
  const [bookingService,setBookingService]=useState(null);
  const [user,setUser]=useState(demoMode?{name:"Demo",phone:"000000000"}:null);
  const [loginContext,setLoginContext]=useState("appointments");
  const [showLogin,setShowLogin]=useState(false);
  const [slideDir,setSlideDir]=useState(null);
  const [animKey,setAnimKey]=useState(0);

  const TAB_ORDER=["home","services","booking","appointments","profile"];

  function handleNavWithReset(view,dir=null){
    if(view!=="booking") setBookingService(null);
    if(!demoMode&&(view==="appointments"||view==="profile")&&!user){
      setLoginContext(view); setShowLogin(true); return;
    }
    setShowLogin(false);
    if(dir){setSlideDir(dir);setAnimKey(k=>k+1);}
    setClientNav(view);
  }
  function handleSwipeLeft(){
    if(showLogin) return;
    const cur=TAB_ORDER.indexOf(clientNav);
    if(cur<TAB_ORDER.length-1) handleNavWithReset(TAB_ORDER[cur+1],"left");
  }
  function handleSwipeRight(){
    if(showLogin) return;
    const cur=TAB_ORDER.indexOf(clientNav);
    if(cur>0) handleNavWithReset(TAB_ORDER[cur-1],"right");
  }
  const swipeHandlers=useSwipe(handleSwipeLeft,handleSwipeRight);

  const slideStyle=slideDir?{animation:`slideIn${slideDir==="left"?"Left":"Right"} 0.28s cubic-bezier(0.25,0.46,0.45,0.94) both`}:{};
  const topPad=demoMode?44:0;

  return(
    <div style={{fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",maxWidth:860,margin:"0 auto",background:"#F8F7F5",minHeight:"100vh",overflow:"hidden"}}>
      <style>{`
        @keyframes slideInLeft{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes slideInRight{from{transform:translateX(-40px);opacity:0}to{transform:translateX(0);opacity:1}}
      `}</style>

      {demoMode&&<DemoBanner label="Estás probando la app como cliente" onBack={onExitDemo}/>}

      {showLogin?(
        <div style={{paddingTop:topPad}}>
          <LoginView context={loginContext} onLogin={u=>{setUser(u);setShowLogin(false);setClientNav(loginContext);}} onBack={()=>{setShowLogin(false);setClientNav("home");}}/>
        </div>
      ):(
        <div key={animKey} style={{...slideStyle,minHeight:"100vh",paddingTop:topPad}} {...swipeHandlers}>
          {clientNav==="home"&&<HomeView onNav={handleNavWithReset} appointments={appointments} onReservar={()=>setClientNav("booking")}/>}
          {clientNav==="services"&&<ServicesView onBookService={s=>{setBookingService(s);setClientNav("booking");}}/>}
          {clientNav==="booking"&&<BookingView key={bookingService?.id||"booking"} appointments={appointments} onAppointmentCreated={onAppointmentCreated} initialService={bookingService}/>}
          {clientNav==="appointments"&&<AppointmentsView appointments={appointments}/>}
          {clientNav==="profile"&&(user?<ProfileViewLoggedIn user={user} onLogout={()=>{if(!demoMode){setUser(null);setClientNav("home");}}}/>:<ProfileView/>)}
        </div>
      )}
      <BottomNav active={showLogin?loginContext:clientNav} onNav={v=>handleNavWithReset(v)}/>
    </div>
  );
}

// ============================================================
// BUSINESS APP — wrapper reutilizable (demo + producción)
// ============================================================


// ══ BusinessApp ══

function BusinessApp({ appointments, onAppointmentCreated, demoMode=false, onExitDemo, onReset }){
  const topPad=demoMode?44:0;
  return(
    <div style={{fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif",maxWidth:860,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:"#F8F7F5"}}>
      {demoMode&&<DemoBanner label="Panel del negocio" onBack={onExitDemo} onReset={onReset}/>}
      <div style={{flex:1,overflowY:"auto",paddingTop:topPad}}>
        <AdminView appointments={appointments} onAddAppointment={onAppointmentCreated}/>
      </div>
    </div>
  );
}

// ============================================================



// ══ APP ══
function HamburgerMenu({onClient, onDemo, onBusiness}) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{position:'fixed',top:0,right:0,zIndex:600}}>
      <button
        onClick={()=>setOpen(!open)}
        aria-label="Menú"
        style={{background:'#1a1a1a',border:'none',borderBottomLeftRadius:10,padding:'12px 14px',cursor:'pointer',display:'flex',flexDirection:'column',gap:5,alignItems:'center',boxShadow:'0 2px 12px rgba(0,0,0,0.2)'}}
      >
        <span style={{display:'block',width:20,height:2,background:'#B89A5A',transition:'all 0.2s',transform:open?'rotate(45deg) translate(4px,5px)':'none'}}/>
        <span style={{display:'block',width:20,height:2,background:'#B89A5A',opacity:open?0:1,transition:'opacity 0.15s'}}/>
        <span style={{display:'block',width:20,height:2,background:'#B89A5A',transition:'all 0.2s',transform:open?'rotate(-45deg) translate(4px,-5px)':'none'}}/>
      </button>
      {open && (
        <>
          <div onClick={()=>setOpen(false)} style={{position:'fixed',inset:0,zIndex:-1}}/>
          <div style={{position:'absolute',top:'100%',right:0,background:'#fff',border:'1px solid #F0EDE8',borderRadius:'0 0 0 12px',overflow:'hidden',minWidth:220,boxShadow:'0 8px 24px rgba(0,0,0,0.12)'}}>
            {[
              {label:'Vista Cliente',desc:'App de reservas del cliente',icon:'◎',action:()=>{onClient();setOpen(false);}},
              {label:'Ver Demo',desc:'Selector de vista',icon:'✦',action:()=>{onDemo();setOpen(false);}},
              {label:'Panel Peluquería',desc:'Gestión del negocio',icon:'◫',action:()=>{onBusiness();setOpen(false);}},
            ].map((item,i,arr)=>(
              <button key={item.label} onClick={item.action}
                style={{display:'block',width:'100%',background:'none',border:'none',borderBottom:i<arr.length-1?'1px solid #F5F5F5':'none',padding:'13px 18px',textAlign:'left',cursor:'pointer',fontFamily:'inherit',transition:'background 0.15s'}}
                onMouseEnter={e=>e.currentTarget.style.background='#FAFAFA'}
                onMouseLeave={e=>e.currentTarget.style.background='none'}
              >
                <div style={{display:'flex',alignItems:'center',gap:12}}>
                  <span style={{fontSize:16,color:'#B89A5A',width:22,flexShrink:0}}>{item.icon}</span>
                  <div>
                    <p style={{margin:0,fontSize:13,fontWeight:700,color:'#1a1a1a'}}>{item.label}</p>
                    <p style={{margin:'1px 0 0',fontSize:11,color:'#aaa'}}>{item.desc}</p>
                  </div>
                </div>
              </button>
            ))}
            <div style={{padding:'8px 18px 10px',borderTop:'1px solid #F5F5F5',background:'#FAFAFA'}}>
              <p style={{margin:0,fontSize:10,color:'#ccc',letterSpacing:1,textTransform:'uppercase'}}>Demo · Limonada Web</p>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function App(){
  const [mode,setMode]=useState("demoClient");
  const [appointments,setAppointments]=useState(initialAppointments);
  function handleAppointmentCreated(apt){setAppointments(p=>[...p,apt]);}
  function handleResetDemo(){setAppointments(initialAppointments);}
  const W="'Inter',-apple-system,BlinkMacSystemFont,sans-serif";

  const menu=<HamburgerMenu onClient={()=>setMode("demoClient")} onDemo={()=>setMode("demo")} onBusiness={()=>setMode("demoBusiness")}/>;

  return(
    <div style={{fontFamily:W,background:'#F0EDE8',minHeight:'100vh'}}>
      {menu}
      <div style={{maxWidth:860,margin:'0 auto',background:'#F8F7F5',minHeight:'100vh',boxShadow:'0 0 60px rgba(0,0,0,0.08)'}}>
        {mode==="demo" && <DemoPortal onDemoClient={()=>setMode("demoClient")} onDemoBusiness={()=>setMode("demoBusiness")} onBack={()=>setMode("demoClient")}/>}
        {mode==="demoClient" && <ClientApp appointments={appointments} onAppointmentCreated={handleAppointmentCreated} demoMode={true} onExitDemo={()=>setMode("demo")}/>}
        {mode==="demoBusiness" && <BusinessApp appointments={appointments} onAppointmentCreated={handleAppointmentCreated} demoMode={true} onExitDemo={()=>setMode("demo")} onReset={handleResetDemo}/>}
        {mode==="businessLogin" && <BusinessLogin onLogin={()=>setMode("demoBusiness")} onDemoAccess={()=>setMode("demoBusiness")} onBack={()=>setMode("demoClient")}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(React.StrictMode, null, React.createElement(App))
);

  </script>
